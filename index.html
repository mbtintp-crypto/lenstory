/* ============ 표정 스탠딩 (인페인팅) ============
   기본 스탠딩에서 얼굴 범위만 칠해 두고, 그 부분만 표정 태그로 다시 그려요.
   얼굴 주변을 잘라 크게 키워서 그리고, 줄여서 원본에 부드럽게 섞어요(원본의 투명 배경은 그대로). */
const FACE_PRESETS=[['평온','calm, relaxed, closed mouth, soft eyes'],['미소','gentle smile, closed mouth, happy'],['웃음','smile, happy, open mouth'],['폭소','laughing, open mouth, closed eyes'],
  ['슬픔','sad, frown, teary eyes'],['울먹','teary eyes, trembling lips, about to cry'],['화남','angry, frown, clenched teeth'],['짜증','annoyed, frown, pout'],['놀람','surprised, open mouth, wide-eyed'],
  ['당황','nervous, sweatdrop, awkward smile'],['부끄럼','embarrassed, blush, wavy mouth'],['수줍음','shy, blush, looking away'],['의기양양','smug, smirk, half-closed eyes'],
  ['진지','serious, closed mouth, v-shaped eyebrows'],['걱정','worried, frown, sweat'],['생각','thinking, pensive, looking away'],['피곤','tired, half-closed eyes, sigh'],['무표정','expressionless, closed mouth']];
const FACE_BASIC=['평온','미소','슬픔','화남','놀람','당황'];
const FACE_W=[1.25,1.5,1.8];
const faceTags=n=>(FACE_PRESETS.find(p=>p[0]===n)||[])[1]||'';
function ensureFaces(c){ if(!Array.isArray(c.faces)) c.faces=FACE_BASIC.map(n=>({id:'f'+uid(),name:n,tags:faceTags(n),img:null})); return c.faces; }
// VN에서 쓰는 스탠딩: 표정 그림이 있으면 그것, 없으면 기본
function standingSrc(c,face){ if(face&&Array.isArray(c.faces)){ const f=c.faces.find(x=>x.name===face&&x.img)||c.faces.find(x=>x.img&&face.includes(x.name)); if(f&&imgSrc(f.img)) return imgSrc(f.img); } return imgSrc(c.img); }

const loadImg=src=>new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new AppErr('img','그림을 읽지 못했어요.')); im.src=src; });
const mkCanvas=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
// 얼굴 자동: 스탠딩 비율로 대략 얼굴 자리에 타원
function autoFaceMask(W,H,ctx){ const tall=H/W>1.25; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(W*.5,H*(tall?.15:.26),W*(tall?.11:.16),H*(tall?.065:.11),0,0,Math.PI*2); ctx.fill(); }

// 칠한 곳 주변만 잘라 크게 그리고 원본에 섞어요. draw(imgB64,maskB64,w,h) → Blob
async function focusedInpaint(src,maskUrl,draw){
  const o=await loadImg(src), W=o.naturalWidth, H=o.naturalHeight;
  const M=mkCanvas(W,H), mx=M.getContext('2d',{willReadFrequently:true}); mx.fillStyle='#000'; mx.fillRect(0,0,W,H); mx.drawImage(await loadImg(maskUrl),0,0,W,H);
  const md=mx.getImageData(0,0,W,H).data; let bx0=W,by0=H,bx1=0,by1=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(md[(y*W+x)*4]>127){ if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; }
  if(bx1<bx0) throw new AppErr('mask','얼굴 범위가 비어 있어요. 먼저 얼굴을 칠해 주세요.');
  const pad=Math.max(48,Math.round(.45*Math.max(bx1-bx0,by1-by0)));
  const x0=Math.max(0,Math.floor((bx0-pad)/8)*8), y0=Math.max(0,Math.floor((by0-pad)/8)*8), x1=Math.min(W,Math.ceil((bx1+pad)/8)*8), y1=Math.min(H,Math.ceil((by1+pad)/8)*8), cw=x1-x0, ch=y1-y0;
  const sc=Math.min(4,Math.sqrt(1048576/(cw*ch))), tw=Math.max(256,Math.floor(cw*sc/64)*64), th=Math.max(256,Math.floor(ch*sc/64)*64);
  // 투명한 곳은 흰색으로 깔아서 보내요
  const I=mkCanvas(tw,th), ix=I.getContext('2d'); ix.fillStyle='#fff'; ix.fillRect(0,0,tw,th); ix.drawImage(o,x0,y0,cw,ch,0,0,tw,th);
  // NAI 인페인팅은 8px 칸 단위: 칠한 칸은 칸 전체로
  const K=mkCanvas(tw,th), kx=K.getContext('2d',{willReadFrequently:true}); kx.imageSmoothingEnabled=false; kx.drawImage(M,x0,y0,cw,ch,0,0,tw,th);
  const kd=kx.getImageData(0,0,tw,th), BW=Math.ceil(tw/8), on=new Uint8Array(BW*Math.ceil(th/8));
  for(let y=0;y<th;y++) for(let x=0;x<tw;x++) if(kd.data[(y*tw+x)*4]>127) on[(y>>3)*BW+(x>>3)]=1;
  for(let y=0;y<th;y++) for(let x=0;x<tw;x++){ const i=(y*tw+x)*4, v=on[(y>>3)*BW+(x>>3)]?255:0; kd.data[i]=kd.data[i+1]=kd.data[i+2]=v; kd.data[i+3]=255; } kx.putImageData(kd,0,0);
  const res=await draw(I.toDataURL('image/png').split(',')[1],K.toDataURL('image/png').split(',')[1],tw,th);
  const ru=URL.createObjectURL(res);
  try{ const r=await loadImg(ru), f=cw/tw;
    // 칠한 곳을 조금 넓히고 가장자리를 흐려서 이음매를 숨겨요
    const D=mkCanvas(W,H), dx=D.getContext('2d',{willReadFrequently:true}); dx.filter=`blur(${Math.max(2,Math.round(16*f))}px)`; dx.drawImage(M,0,0); dx.filter='none';
    const dd=dx.getImageData(0,0,W,H); for(let i=0;i<dd.data.length;i+=4){ const v=dd.data[i]>8?255:0; dd.data[i]=dd.data[i+1]=dd.data[i+2]=v; dd.data[i+3]=255; } dx.putImageData(dd,0,0);
    const F=mkCanvas(W,H), fx=F.getContext('2d',{willReadFrequently:true}); fx.fillStyle='#000'; fx.fillRect(0,0,W,H); fx.save(); fx.beginPath(); fx.rect(x0,y0,cw,ch); fx.clip(); fx.filter=`blur(${Math.max(2,Math.round(10*f))}px)`; fx.drawImage(D,0,0); fx.restore();
    const A=mkCanvas(W,H), ax=A.getContext('2d',{willReadFrequently:true}); ax.drawImage(o,0,0,W,H);
    const B=mkCanvas(W,H), bx=B.getContext('2d',{willReadFrequently:true}); bx.drawImage(r,0,0,tw,th,x0,y0,cw,ch);
    const ad=ax.getImageData(0,0,W,H), bd=bx.getImageData(0,0,W,H).data, fd=fx.getImageData(0,0,W,H).data;
    for(let i=0;i<ad.data.length;i+=4){ const k=fd[i]/255; if(k<=.002) continue; ad.data[i]=ad.data[i]*(1-k)+bd[i]*k; ad.data[i+1]=ad.data[i+1]*(1-k)+bd[i+1]*k; ad.data[i+2]=ad.data[i+2]*(1-k)+bd[i+2]*k; } // 알파는 원본 그대로
    ax.putImageData(ad,0,0); return await toBlob(A); }
  finally{ URL.revokeObjectURL(ru); } }

async function drawFace(c,face){
  if(!c.img||!imgSrc(c.img)) throw new AppErr('face','기본 스탠딩을 먼저 그리거나 가져와 주세요.');
  if(!c.faceMask) throw new AppErr('face','얼굴 범위를 먼저 칠해 주세요.');
  const w=FACE_W[clamp(+SET.nai.faceLv||1,0,2)], art=charArt(c), style=art.style||SET.nai.style;
  const input=tagJoin(style,c.naiPrompt,`${w}::${face.tags||faceTags(face.name)||face.name}::`,'1.2::expressive face::','portrait, face focus');
  const neg=tagJoin(SET.nai.neg,c.artNeg,'blurry, deformed face, multiple views');
  const tags=face.tags||faceTags(face.name)||face.name, lv=clamp(+SET.nai.faceLv||1,0,2);

/* ---------- 얼굴 범위 칠하기 ---------- */
function openMaskPainter(src,prev){ return new Promise(async res=>{
  const im=await loadImg(src), W=im.naturalWidth, H=im.naturalHeight;
  const mk=mkCanvas(W,H), mx=mk.getContext('2d',{willReadFrequently:true}); mx.fillStyle='#000'; mx.fillRect(0,0,W,H);
  if(prev){ try{ mx.drawImage(await loadImg(prev),0,0,W,H); }catch(e){} } else autoFaceMask(W,H,mx);
  const d=document.createElement('div'); d.className='mpaint';
  d.innerHTML=`<header class="appbar" style="margin:0"><button class="ibtn sl" data-m="cancel" aria-label="닫기">${ic('close')}</button><h1 class="t title-l">얼굴 범위</h1><button class="btn text sl" data-m="save" id="mpSave">저장</button></header>
  <div class="mp-stage"><canvas aria-label="얼굴 범위를 칠하는 캔버스"></canvas></div>
  <div class="mp-tools"><p class="body-s var">눈·눈썹·입이 들어가게 칠해요. 머리카락과 옷은 빼는 게 좋아요. 모든 표정에 같이 써요.</p>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><div class="seg" style="flex:1"><button type="button" class="sl on" data-m="brush">${ic('check')}칠하기</button><button type="button" class="sl" data-m="erase">${ic('check')}지우개</button></div>
  <input type="range" min="8" max="160" value="48" aria-label="붓 크기" style="width:96px"></div>
  <div class="row" style="margin-top:8px"><button class="btn text sl" data-m="auto">${ic('face')}얼굴 자동</button><button class="btn text sl" data-m="clear">${ic('ink_eraser')}비우기</button></div></div>`;
  document.body.appendChild(d);
  const cv=$('canvas',d), x=cv.getContext('2d'), stage=$('.mp-stage',d);
  const tint=mkCanvas(W,H), tx=tint.getContext('2d',{willReadFrequently:true});
  const draw=()=>{ x.clearRect(0,0,cv.width,cv.height); x.fillStyle='#c9c9c0'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,0,0,cv.width,cv.height);
    const id=mx.getImageData(0,0,W,H).data, t=tx.createImageData(W,H); for(let i=0;i<id.length;i+=4){ t.data[i]=84; t.data[i+1]=101; t.data[i+2]=36; t.data[i+3]=id[i]>127?150:0; } tx.putImageData(t,0,0); x.drawImage(tint,0,0,cv.width,cv.height); };
  const fit=()=>{ const sw=stage.clientWidth-16, sh=stage.clientHeight-16, s=Math.min(sw/W,sh/H); cv.width=Math.max(1,Math.round(W*s)); cv.height=Math.max(1,Math.round(H*s)); draw(); };
  let mode='brush', size=48, down=false, last=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; };
  const stroke=(a,b)=>{ mx.strokeStyle=mode==='erase'?'#000':'#fff'; mx.lineWidth=size*W/cv.width; mx.lineCap='round'; mx.beginPath(); mx.moveTo(a[0],a[1]); mx.lineTo(b[0],b[1]); mx.stroke(); };
  cv.addEventListener('pointerdown',e=>{ down=true; cv.setPointerCapture(e.pointerId); last=pt(e); stroke(last,last); draw(); });
  cv.addEventListener('pointermove',e=>{ if(!down) return; const p=pt(e); stroke(last,p); last=p; draw(); });
  cv.addEventListener('pointerup',()=>down=false); cv.addEventListener('pointercancel',()=>down=false);
  $('input[type=range]',d).addEventListener('input',e=>size=+e.target.value);
  const close=v=>{ removeEventListener('resize',fit); d.remove(); res(v); };
  d.addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; const m=b.dataset.m;
    if(m==='brush'||m==='erase'){ mode=m; $$('[data-m=brush],[data-m=erase]',d).forEach(q=>q.classList.toggle('on',q===b)); }
    else if(m==='clear'){ mx.fillStyle='#000'; mx.fillRect(0,0,W,H); draw(); }
    else if(m==='auto'){ mx.fillStyle='#000'; mx.fillRect(0,0,W,H); autoFaceMask(W,H,mx); draw(); }
    else if(m==='cancel') close(null);
    else if(m==='save'){ const id=mx.getImageData(0,0,W,H).data; let n=0; for(let i=0;i<id.length;i+=4) if(id[i]>127){ n++; break; } if(!n) return toast('얼굴 부분을 먼저 칠해 주세요','err'); close(mk.toDataURL('image/png')); } });
  addEventListener('resize',fit); setTimeout(fit,30); }); }

/* ============ 게임 서버 연결 ============
   배포판(FRIEND): 초대 코드로 서버를 불러요. 키·프롬프트는 서버에만 있어요.
   개인용 + 관리자: 서버 설정을 올리고, 초대 코드를 관리하고, 배포판 파일을 만들어요. */
const srvBase=()=>String(FRIEND?CONFIG.server:SET.server.url||'').trim().replace(/\/+$/,'');
async function api(path,{body,method='POST',admin=false,raw=false,headers={},timeout=300000}={}){
  const base=srvBase(); if(!base) throw new AppErr('server','게임 서버 주소가 없어요.');
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),timeout);
  let r; try{ r=await fetch(base+path,{method,signal:ac.signal,headers:{...(body!==undefined&&typeof body!=='string'?{'content-type':'application/json'}:{'content-type':'text/plain'}),...(admin?{'x-admin-key':SET.server.admin}:{}),...headers},body:body===undefined?undefined:(typeof body==='string'?body:JSON.stringify(body))}); }
  catch(e){ throw new AppErr('network',ac.signal.aborted?'서버 응답이 너무 오래 걸려요. 다시 시도해 주세요.':'게임 서버에 연결하지 못했어요. 인터넷을 확인해 주세요.'); }
  finally{ clearTimeout(t); }
  if(raw&&r.ok) return r;
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false){ if(r.status===401&&FRIEND&&!admin){ SET.remote.code=''; saveSet(); } throw new AppErr('server',j.error||`서버 오류(${r.status})`); }
  return j; }

/* 글 생성: 개인용은 이 기기의 키와 프롬프트, 배포판은 서버 */
async function genAI(key,vars,opts={}){
  if(window.__MOCK_GEM) return window.__MOCK_GEM(fillPrompt(key,withRules(vars)),opts.tier);
  if(FRIEND){ const {__rules,...rest}=vars; const out={}; Object.entries(rest).forEach(([k,v])=>out[k]=String(v??''));
    const j=await api('/api/gen',{body:{code:SET.remote.code,key,vars:out,rules:__rules||{}}}); return j.data; }
  return gem(fillPrompt(key,withRules(vars)),opts); }
function withRules(vars){ if(!vars.__rules) return vars; const {__rules,...rest}=vars; return {...rest,'규칙':fillPrompt('rules',__rules)}; }

/* 그림: 서버가 그림체·공통 태그를 붙여서 NovelAI를 불러요 */
async function remoteNai(m){
  let r;
  if(m.mode==='face'){ const {image,mask,...meta}=m; r=await api('/api/nai',{raw:true,body:JSON.stringify({image,mask}),headers:{'x-meta':encodeURIComponent(JSON.stringify({...meta,code:SET.remote.code}))}}); }
  else r=await api('/api/nai',{raw:true,body:{...m,code:SET.remote.code}});
  const img=await unzipFirst(new Uint8Array(await r.arrayBuffer()));
  return {blob:new Blob([img],{type:imgType(img)||'image/png'}),seed:+r.headers.get('x-seed'),tp:r.headers.get('x-tp')==='1'}; }

  <div class="list" style="margin-top:8px">${list.map(c=>li({tag:'div',cls:'three',attrs:`data-c="${c.code}"`,lead:`<span class="lead-box ${c.enabled?'':'dim'}">${esc(initial(c.name))}</span>`,hl:esc(c.name),
    sup:`<span class="label-l" style="color:var(--md-on-surface)">${c.code}</span><br>오늘 글 ${c.usage.text}/${c.limits.text} · 그림 ${c.usage.img}/${c.limits.img}`,full:true,
    trail:`<span class="row" style="flex-wrap:nowrap;gap:0">${ibtn('','content_copy','코드 복사','','data-a="copy"')}${ibtn('','tune','한도 바꾸기','','data-a="lim"')}${ibtn('','delete','코드 지우기','','data-a="del"')}<label class="switch" title="${c.enabled?'켜짐':'꺼짐'}"><input type="checkbox" data-a="on" ${c.enabled?'checked':''} aria-label="${esc(c.name)} 코드 사용"><span class="track"></span><span class="thumb"></span></label></span>`})).join('')||'<div class="empty"><p class="body-m">아직 초대 코드가 없어요. 지인마다 하나씩 만들어 주세요.</p></div>'}</div>`;
  $$('[data-c]').forEach(row=>row.addEventListener('click',async e=>{ const t=e.target.closest('[data-a]'); if(!t) return; const code=row.dataset.c, c=list.find(x=>x.code===code), a=t.dataset.a;
    try{
      if(a==='copy'){ try{ await navigator.clipboard.writeText(code); toast('코드를 복사했어요'); }catch(_){ toast(code); } }
      if(a==='on'){ await api('/api/admin/codes/'+code,{method:'PATCH',admin:true,body:{enabled:t.checked}}); toast(t.checked?'켰어요':'껐어요'); }
      if(a==='lim'){ const v=await askForm(c.name,`<div class="tf-row">${tf('lT','하루 글 횟수',c.limits.text,{type:'number'})}${tf('lI','하루 그림 장수',c.limits.img,{type:'number'})}</div>`); if(v){ await api('/api/admin/codes/'+code,{method:'PATCH',admin:true,body:{limits:{text:+v.lT,img:+v.lI}}}); refresh(); } }
      if(a==='del'){ if(!await ask('코드를 지울까요?',`${esc(c.name)}님의 코드 ${code}를 지워요. 그 사람은 더 이상 쓸 수 없어요.`,{ok:'지우기',danger:true})) return; await api('/api/admin/codes/'+code,{method:'DELETE',admin:true}); refresh(); }
    }catch(err){ toast(err.message,'err'); } }));
  $('#cNew').onclick=async()=>{ const v=await askForm('초대 코드 만들기',`${tf('nName','누구에게 줄 코드인가요','',{ph:'예: 민지'})}<div class="tf-row">${tf('nT','하루 글 횟수',300,{type:'number',support:'장면 1개 ≈ 1번, 톡 1번 ≈ 1번'})}${tf('nI','하루 그림 장수',30,{type:'number'})}</div>`,{ok:'만들기'}); if(!v) return;
    try{ const j=await api('/api/admin/codes',{admin:true,body:{name:v.nName.trim()||'지인',text:+v.nT,img:+v.nI}});
      await ask('코드를 만들었어요',`<p class="headline-s" style="color:var(--md-on-surface);text-align:center;margin:8px 0 16px;letter-spacing:2px">${j.code.code}</p><p>${esc(j.code.name)}님에게 배포판 파일과 함께 이 코드를 보내 주세요.</p>`,{ok:'복사하고 닫기',cancel:'닫기'}).then(y=>{ if(y) navigator.clipboard.writeText(j.code.code).catch(()=>{}); });
      refresh(); }catch(e){ toast(e.message,'err'); } };
};

</script></body></html>
