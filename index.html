<style>/* ===== Material 3 · 색 역할(시드 #4F5B2E, Tonal Spot) ===== */
:root{ --md-primary:#546524;--md-on-primary:#ffffff;--md-primary-container:#d6eb9b;--md-on-primary-container:#3d4c0d;--md-secondary:#5b6147;--md-on-secondary:#ffffff;--md-secondary-container:#dfe6c4;--md-on-secondary-container:#434931;--md-tertiary:#39665f;--md-on-tertiary:#ffffff;--md-tertiary-container:#bcece2;--md-on-tertiary-container:#204e47;--md-error:#ba1a1a;--md-on-error:#ffffff;--md-error-container:#ffdad6;--md-on-error-container:#93000a;--md-surface:#fafaee;--md-on-surface:#1b1c15;--md-surface-variant:#e3e4d3;--md-on-surface-variant:#46483c;--md-surface-container-lowest:#ffffff;--md-surface-container-low:#f5f4e8;--md-surface-container:#efeee2;--md-surface-container-high:#e9e9dd;--md-surface-container-highest:#e3e3d7;--md-surface-dim:#dbdbcf;--md-surface-bright:#fafaee;--md-outline:#76786b;--md-outline-variant:#c6c8b8;--md-inverse-surface:#303129;--md-inverse-on-surface:#f2f1e5;--md-inverse-primary:#bbcf82;--md-scrim:#000000;--md-shadow:#000000; color-scheme:light; }
@media (prefers-color-scheme:dark){ :root{ --md-primary:#bbcf82;--md-on-primary:#283500;--md-primary-container:#3d4c0d;--md-on-primary-container:#d6eb9b;--md-secondary:#c3caa9;--md-on-secondary:#2d331c;--md-secondary-container:#434931;--md-on-secondary-container:#dfe6c4;--md-tertiary:#a1d0c6;--md-on-tertiary:#023731;--md-tertiary-container:#204e47;--md-on-tertiary-container:#bcece2;--md-error:#ffb4ab;--md-on-error:#690005;--md-error-container:#93000a;--md-on-error-container:#ffdad6;--md-surface:#12140d;--md-on-surface:#e3e3d7;--md-surface-variant:#46483c;--md-on-surface-variant:#c6c8b8;--md-surface-container-lowest:#0d0f08;--md-surface-container-low:#1b1c15;--md-surface-container:#1f2019;--md-surface-container-high:#292b23;--md-surface-container-highest:#34362d;--md-surface-dim:#12140d;--md-surface-bright:#383a32;--md-outline:#909284;--md-outline-variant:#46483c;--md-inverse-surface:#e3e3d7;--md-inverse-on-surface:#303129;--md-inverse-primary:#546524;--md-scrim:#000000;--md-shadow:#000000; color-scheme:dark; } }
.force-dark{ --md-primary:#bbcf82;--md-on-primary:#283500;--md-primary-container:#3d4c0d;--md-on-primary-container:#d6eb9b;--md-secondary:#c3caa9;--md-on-secondary:#2d331c;--md-secondary-container:#434931;--md-on-secondary-container:#dfe6c4;--md-tertiary:#a1d0c6;--md-on-tertiary:#023731;--md-tertiary-container:#204e47;--md-on-tertiary-container:#bcece2;--md-error:#ffb4ab;--md-on-error:#690005;--md-error-container:#93000a;--md-on-error-container:#ffdad6;--md-surface:#12140d;--md-on-surface:#e3e3d7;--md-surface-variant:#46483c;--md-on-surface-variant:#c6c8b8;--md-surface-container-lowest:#0d0f08;--md-surface-container-low:#1b1c15;--md-surface-container:#1f2019;--md-surface-container-high:#292b23;--md-surface-container-highest:#34362d;--md-surface-dim:#12140d;--md-surface-bright:#383a32;--md-outline:#909284;--md-outline-variant:#46483c;--md-inverse-surface:#e3e3d7;--md-inverse-on-surface:#303129;--md-inverse-primary:#546524;--md-scrim:#000000;--md-shadow:#000000; color-scheme:dark; }

:root{
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --serif:'Noto Serif KR',serif;
  --shape-xs:4px; --shape-s:8px; --shape-m:12px; --shape-l:16px; --shape-xl:28px; --shape-full:999px;
  --elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elev-2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --elev-3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
  --ease:cubic-bezier(.2,0,0,1); --ease-dec:cubic-bezier(.05,.7,.1,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--md-surface);color:var(--md-on-surface);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;font-size:14px;line-height:20px;letter-spacing:.25px}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--md-secondary);outline-offset:2px}
p{margin:0}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none;flex:none;width:1em;overflow:hidden}
.icon.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* ===== 타입 스케일 ===== */
.headline-l{font-size:32px;line-height:40px;font-weight:400;letter-spacing:0}
.headline-m{font-size:28px;line-height:36px;font-weight:400;letter-spacing:0}
.headline-s{font-size:24px;line-height:32px;font-weight:400;letter-spacing:0}
.title-l{font-size:22px;line-height:28px;font-weight:400;letter-spacing:0}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.title-s{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.body-l{font-size:16px;line-height:24px;letter-spacing:.5px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.25px}
.body-s{font-size:12px;line-height:16px;letter-spacing:.4px}
.label-l{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.serif{font-family:var(--serif)}
.var{color:var(--md-on-surface-variant)}
.err-t{color:var(--md-error)}
.ok-t{color:var(--md-primary)}

/* ===== 레이아웃 ===== */
.page{max-width:640px;margin:0 auto;padding:0 16px 120px}
.section-h{padding:24px 0 8px;color:var(--md-primary)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.divider{height:1px;background:var(--md-outline-variant);margin:16px 0}

/* ===== 상단 앱 바 ===== */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;height:64px;padding:0 4px;margin:0 -16px;background:var(--md-surface);transition:background .2s}
.appbar.scrolled{background:var(--md-surface-container)}
.appbar .t{flex:1;min-width:0;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .av{margin-left:4px}
.large-title{padding:8px 0 20px}

/* ===== 상태 레이어 ===== */
.sl{position:relative;overflow:hidden;isolation:isolate}
.sl::before{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;z-index:-1;pointer-events:none;border-radius:inherit}
.sl:hover::before{opacity:.08}
.sl:focus-visible::before{opacity:.1}
.sl:active::before{opacity:.12}

/* ===== 버튼 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:var(--shape-full);font-size:14px;font-weight:500;letter-spacing:.1px;white-space:nowrap}
.btn .icon{font-size:18px;margin-left:-8px}
.btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn.filled:hover{box-shadow:var(--elev-1)}
.btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.outlined{border:1px solid var(--md-outline);color:var(--md-primary);padding:0 23px}
.btn.text{color:var(--md-primary);padding:0 12px}
.btn.text .icon{margin-left:-4px}
.btn.danger{color:var(--md-error)}
.btn.block{width:100%}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn:disabled::before{display:none}
.ibtn{width:40px;height:40px;border-radius:var(--shape-full);display:inline-grid;place-items:center;color:var(--md-on-surface-variant);flex:none}
.ibtn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.ibtn:disabled{opacity:.38}
.fab{position:fixed;right:16px;bottom:16px;z-index:25;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border-radius:var(--shape-l);background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--elev-3);font-weight:500;font-size:14px;letter-spacing:.1px}
@media (min-width:672px){.fab{right:calc(50% - 320px + 16px)}}

/* ===== 카드 ===== */
.card{border-radius:var(--shape-m);padding:16px;display:block;width:100%;text-align:left}
.card.filled{background:var(--md-surface-container-highest)}
.card.elevated{background:var(--md-surface-container-low);box-shadow:var(--elev-1)}
.card.outlined{background:var(--md-surface);border:1px solid var(--md-outline-variant)}
button.card{color:inherit}

/* ===== 리스트 ===== */
.list{margin:0 -16px}
.li{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 24px 8px 16px;width:100%;text-align:left;color:inherit}
.li.three{align-items:flex-start;min-height:88px;padding-top:12px;padding-bottom:12px}
.li .lead-ic{color:var(--md-on-surface-variant)}
.li .txt{flex:1;min-width:0}
.li .hl{font-size:16px;line-height:24px;letter-spacing:.5px;color:var(--md-on-surface)}
.li .sup{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--md-on-surface-variant);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li .sup.full{display:block;-webkit-line-clamp:unset}
.li .trail{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant);white-space:nowrap}
.li:disabled{opacity:.38;cursor:default}
.li:disabled::before{display:none}
.li.danger .hl,.li.danger .lead-ic{color:var(--md-error)}
.lead-box{width:40px;height:40px;border-radius:var(--shape-full);display:grid;place-items:center;flex:none;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.lead-box.ter{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.lead-box.dim{background:var(--md-surface-container-highest);color:var(--md-on-surface-variant)}

/* ===== 아바타 ===== */
.av{width:40px;height:40px;border-radius:var(--shape-full);flex:none;display:grid;place-items:center;font-weight:500;font-size:16px;background:var(--md-primary-container) center 15%/cover no-repeat;color:var(--md-on-primary-container);overflow:hidden}
.av.sm{width:32px;height:32px;font-size:14px}
.stackav{display:flex}
.stackav .av{margin-left:-8px;box-shadow:0 0 0 2px var(--md-surface-container-low)}
.stackav .av:first-child{margin-left:0}

/* ===== 텍스트 필드(아웃라인) ===== */
.tf{position:relative;display:block;margin:20px 0 4px}
.tf>.lab{position:absolute;left:12px;top:-8px;padding:0 4px;font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--md-on-surface-variant);background:var(--md-surface);z-index:1;transition:color .15s;pointer-events:none}
.tf input,.tf textarea,.tf select{width:100%;border:1px solid var(--md-outline);border-radius:var(--shape-xs);background:transparent;padding:14px 16px;font-size:16px;line-height:24px;letter-spacing:.5px;color:var(--md-on-surface);outline:none;appearance:none}
.tf textarea{resize:vertical;min-height:96px;display:block}
.tf textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:18px;letter-spacing:0}
.tf select{background-image:linear-gradient(45deg,transparent 50%,var(--md-on-surface-variant) 50%),linear-gradient(135deg,var(--md-on-surface-variant) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.tf select option{background:var(--md-surface-container-high);color:var(--md-on-surface)}
.tf:focus-within>.lab{color:var(--md-primary)}
.tf input:focus,.tf textarea:focus,.tf select:focus{border:2px solid var(--md-primary);padding:13px 15px}
.tf input::placeholder,.tf textarea::placeholder{color:var(--md-on-surface-variant);opacity:.7}
.supporting{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--md-on-surface-variant);padding:4px 16px 0}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-row.three{grid-template-columns:2fr 1fr 1fr}

/* ===== 세그먼트 버튼 ===== */
.field-lab{display:block;margin:24px 0 8px;color:var(--md-on-surface-variant)}
.seg{display:flex;height:40px;border:1px solid var(--md-outline);border-radius:var(--shape-full);overflow:hidden}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface);border-left:1px solid var(--md-outline);min-width:0;padding:0 8px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg button .icon{font-size:18px;width:0;transition:width .15s var(--ease)}
.seg button.on .icon{width:18px}

/* ===== 스위치 ===== */
.sw-row{display:flex;align-items:center;gap:16px;padding:12px 0;cursor:pointer}
.sw-row .txt{flex:1}
.switch{position:relative;display:inline-block;vertical-align:middle;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;border-radius:var(--shape-full);background:var(--md-surface-container-highest);border:2px solid var(--md-outline);transition:background .2s}
.switch .thumb{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--md-outline);transition:all .2s var(--ease)}
.switch input:checked~.track{background:var(--md-primary);border-color:var(--md-primary)}
.switch input:checked~.thumb{left:24px;top:4px;width:24px;height:24px;background:var(--md-on-primary)}
.switch input:focus-visible~.track{outline:2px solid var(--md-secondary);outline-offset:2px}

/* ===== 칩 ===== */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--shape-s);border:1px solid var(--md-outline-variant);font-size:14px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.chip .icon{font-size:18px;margin-left:-4px}

/* ===== 진행 표시 ===== */
.lin{height:4px;border-radius:var(--shape-full);background:var(--md-secondary-container);overflow:hidden}
.lin>i{display:block;height:100%;background:var(--md-primary);border-radius:var(--shape-full)}
.spinner{width:48px;height:48px;animation:rot 1.4s linear infinite}
.spinner circle{fill:none;stroke:var(--md-primary);stroke-width:4;stroke-linecap:round;animation:dash 1.4s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes dash{0%{stroke-dasharray:1 150;stroke-dashoffset:0}50%{stroke-dasharray:90 150;stroke-dashoffset:-35}100%{stroke-dasharray:90 150;stroke-dashoffset:-124}}

/* ===== 내비게이션 바 ===== */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--md-surface-container);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.navbar .in{display:flex;width:100%;max-width:640px;height:80px}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 16px;color:var(--md-on-surface-variant);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.nav-it .ind{position:relative;width:64px;height:32px;border-radius:var(--shape-l);display:grid;place-items:center;transition:background .2s}
.nav-it:hover .ind{background:color-mix(in srgb,var(--md-on-surface) 8%,transparent)}
.nav-it.on{color:var(--md-on-surface)}
.nav-it.on .ind{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.nav-it.on .icon{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.badge{position:absolute;top:2px;right:16px;width:6px;height:6px;border-radius:50%;background:var(--md-error)}

/* ===== 다이얼로그 · 스낵바 ===== */
.scrim{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--md-scrim) 32%,transparent);display:grid;place-items:center;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--md-surface-container-high);color:var(--md-on-surface);border-radius:var(--shape-xl);width:100%;max-width:560px;min-width:280px;max-height:86dvh;overflow:auto;padding:24px;box-shadow:var(--elev-3);animation:pop .3s var(--ease-dec)}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.98)}}
.dialog .d-ic{display:block;margin:0 auto 16px;color:var(--md-secondary)}
.dialog .d-ic+h2{text-align:center}
.dialog h2{margin:0 0 16px}
.dialog .d-body{color:var(--md-on-surface-variant)}
.dialog .d-act{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.dialog .tf>.lab{background:var(--md-surface-container-high)}
.dialog.busy{max-width:320px;text-align:center}
.dialog.busy .spinner{margin:8px auto 20px;display:block}
.snack-host{position:fixed;left:0;right:0;bottom:16px;z-index:90;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
body.with-nav .snack-host{bottom:96px}
body.in-chat .snack-host{bottom:84px}
body.in-vn .snack-host{bottom:auto;top:64px}
.snack{background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);border-radius:var(--shape-xs);min-height:48px;padding:14px 16px;max-width:560px;box-shadow:var(--elev-3);font-size:14px;line-height:20px;letter-spacing:.25px;display:flex;align-items:center;gap:12px;animation:pop .25s var(--ease-dec)}
.snack .icon{color:var(--md-inverse-primary);font-size:20px}
.snack.err .icon{color:#ffb4ab}

/* ===== 홈 ===== */
.gcard{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.gcard .top{display:flex;align-items:center;gap:12px}
.gcard .ttl{font-family:var(--serif);font-size:22px;line-height:28px;font-weight:600}
.empty{text-align:center;padding:48px 24px;color:var(--md-on-surface-variant)}
.empty .icon{font-size:48px;width:auto;color:var(--md-outline);margin-bottom:12px}
.notice{display:flex;gap:16px;align-items:flex-start;margin:8px 0 16px}
.notice>.icon{color:var(--md-primary)}

/* ===== 게임: 이야기 ===== */
.g-title{font-family:var(--serif);font-weight:600}
.logline{font-family:var(--serif);font-size:16px;line-height:28px;margin-top:12px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chapter{margin-top:12px;padding:16px 0 8px;border-radius:var(--shape-l)}
.chapter.cur{background:var(--md-surface-container-low)}
.chapter .ch-h{display:flex;align-items:baseline;gap:12px;padding:0 16px 8px}
.chapter .ch-n{color:var(--md-primary)}
.chapter .ch-t{font-family:var(--serif);font-size:18px;line-height:26px;font-weight:600}
.chapter.locked .ch-t{color:var(--md-on-surface-variant);font-weight:400}
.chapter .summary{padding:4px 16px 8px;color:var(--md-on-surface-variant)}
.chapter .acts{padding:8px 16px}
.chapter .li{padding-left:16px;border-radius:var(--shape-m)}
.stage .lead-box{width:36px;height:36px}
.stage.done .lead-box{background:var(--md-primary);color:var(--md-on-primary)}

/* ===== 게임: 인물 ===== */
.person{display:grid;grid-template-columns:104px 1fr;gap:16px;margin-bottom:12px}
.portrait{width:104px;height:140px;border-radius:var(--shape-m);background:var(--md-primary-container) center 12%/cover no-repeat;display:grid;place-items:center;font-size:36px;color:var(--md-on-primary-container);font-family:var(--serif)}
.person .nm{font-family:var(--serif);font-size:22px;line-height:28px;font-weight:600}
.aff-row{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.aff-row .lin{flex:1}

<body><div id="app"></div>
<script>
/* ============ 기본 도구 ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class AppErr extends Error{constructor(code,msg){super(msg||code);this.code=code;}}

const ic=(name,cls='')=>`<span class="icon ${cls}" aria-hidden="true">${name}</span>`;
/* M3 스낵바: 한 번에 하나씩, 차례로 */
const SNQ=[]; let SNON=false;
function toast(msg,kind=''){ SNQ.push({msg,kind}); if(SNQ.length>4) SNQ.splice(0,SNQ.length-4); if(!SNON) snackNext(); }
function snackNext(){ const it=SNQ.shift(); if(!it){ SNON=false; return; } SNON=true;
  let host=$('#snack'); if(!host){ host=document.createElement('div'); host.id='snack'; host.className='snack-host'; host.setAttribute('role','status'); host.setAttribute('aria-live','polite'); document.body.appendChild(host); }
  const icn=it.kind==='err'?'error':it.kind==='gold'?'key':'check_circle';
  host.innerHTML=`<div class="snack ${it.kind}">${ic(icn)}<span>${esc(it.msg)}</span></div>`;
  setTimeout(()=>{ host.innerHTML=''; setTimeout(snackNext,180); },it.kind==='err'?5200:2600); }
/* M3 다이얼로그 (confirm 대체) */
function ask(title,body,{ok='확인',cancel='취소',danger=false,icon=''}={}){ return new Promise(res=>{
  const d=document.createElement('div'); d.className='scrim';
  d.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">${icon?ic(icon,'d-ic'):''}<h2 class="headline-s" id="dlgT">${esc(title)}</h2><div class="d-body body-m">${body}</div>
  <div class="d-act"><button class="btn text sl" id="dlgNo">${esc(cancel)}</button><button class="btn text sl ${danger?'danger':''}" id="dlgOk">${esc(ok)}</button></div></div>`;
  const done=v=>{ d.remove(); res(v); };
  d.addEventListener('click',e=>{ if(e.target===d) done(false); });
  document.body.appendChild(d); $('#dlgOk',d).onclick=()=>done(true); $('#dlgNo',d).onclick=()=>done(false); $('#dlgOk',d).focus(); }); }

/* ============ 모드: 개인용 / 지인 배포판 ============
   배포판은 <script id="sgm-config">에 서버 주소가 들어 있고, 키와 프롬프트 없이 서버를 거쳐서만 AI를 불러요. */
const CONFIG=(()=>{ try{ return JSON.parse(document.getElementById('sgm-config').textContent)||{}; }catch(e){ return {}; } })();
const FRIEND=CONFIG.mode==='friend'&&!!CONFIG.server;
const SELF_HTML='<!doctype html>\n'+document.documentElement.outerHTML; // 배포판을 만들 때 이 문서를 그대로 복사해요

/* ============ 설정 (이 기기에만 저장) ============ */
const SKEY=FRIEND?'sgm-play-settings':'sgm-settings';
const NAI_NEG='lowres, artistic error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, multiple views, logo, too many watermarks, text, signature';
const DEF_SET={
  ai:{sa:'',region:'global',model:'gemini-3.8-flash',quick:'gemini-3.5-flash-lite',relay:''},
  nai:{key:'',model:'nai-diffusion-5-full',inpaintModel:'',style:'',neg:NAI_NEG,steps:28,scale:6,sampler:'k_euler_ancestral',transparent:true,cutout:true,auto:false,faceLv:1},
  ui:{speed:26},
  server:{url:'',admin:''},
  remote:{code:'',name:'',cfg:null}
};
function merge(a,b){ const o=Array.isArray(a)?[...a]:{...a}; for(const k in b){ o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object')?merge(a[k],b[k]):b[k]; } return o; }
function loadSet(){ try{ return merge(DEF_SET,JSON.parse(localStorage.getItem(SKEY)||'{}')); }catch(e){ return merge(DEF_SET,{}); } }
let SET=loadSet();
function saveSet(){ try{ localStorage.setItem(SKEY,JSON.stringify(SET)); }catch(e){ toast('설정을 저장하지 못했어요','err'); } }

/* ============ 저장소 (IndexedDB: 게임과 그림) ============ */
const DB={
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{ const q=indexedDB.open(FRIEND?'story-game-maker-play':'story-game-maker',1);
      q.onupgradeneeded=()=>{ const d=q.result; if(!d.objectStoreNames.contains('games')) d.createObjectStore('games'); if(!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs'); };
      q.onsuccess=()=>{ this.db=q.result; res(this.db); }; q.onerror=()=>rej(q.error); }); },
  async tx(store,mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode), s=t.objectStore(store); const r=fn(s); t.oncomplete=()=>res(r&&'result' in r?r.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  get(s,k){ return this.tx(s,'readonly',st=>st.get(k)); },
  put(s,k,v){ return this.tx(s,'readwrite',st=>st.put(v,k)); },
  del(s,k){ return this.tx(s,'readwrite',st=>st.delete(k)); },
  all(s){ return this.tx(s,'readonly',st=>st.getAll()); },
};

/* 그림: 블롭은 imgs에, 게임에는 id만 */
const URLC=new Map();
async function imgPut(blob){ const id='i'+uid(); await DB.put('imgs',id,blob); return id; }
async function imgLoad(id){ if(!id) return ''; if(URLC.has(id)) return URLC.get(id); const b=await DB.get('imgs',id); if(!b) return ''; const u=URL.createObjectURL(b); URLC.set(id,u); return u; }
const imgSrc=id=>(id&&URLC.get(id))||'';
async function imgDrop(id){ if(!id) return; const u=URLC.get(id); if(u) URL.revokeObjectURL(u); URLC.delete(id); try{ await DB.del('imgs',id); }catch(e){} }
function allImgIds(g){ const ids=[]; (g.chars||[]).forEach(c=>{ c.img&&ids.push(c.img); (c.faces||[]).forEach(f=>f.img&&ids.push(f.img)); }); Object.values(g.lib?.bg||{}).forEach(b=>b.img&&ids.push(b.img)); Object.values(g.lib?.cg||{}).forEach(b=>b.img&&ids.push(b.img)); return ids; }
async function preloadImgs(g){ await Promise.all(allImgIds(g).map(imgLoad)); }

const blobToDataURL=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }

/* 외부 그림 가져오기: 너무 큰 그림은 줄여서 저장 */
function pickImage(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>res(i.files&&i.files[0]||null); i.click(); }); }
async function shrinkImage(file,max=1600){
  try{ const bmp=await createImageBitmap(file); const s=Math.min(1,max/Math.max(bmp.width,bmp.height)); if(s>=1&&file.size<2.5e6) return file;
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const type=/png|webp/.test(file.type)?'image/png':'image/jpeg';
    return await new Promise(r=>cv.toBlob(b=>r(b||file),type,.9)); }catch(e){ return file; }
}

/* ============ 게임 ============ */
let G=null; // 지금 열린 게임
async function saveG(){ if(!G) return; G.updated=Date.now(); await DB.put('games',G.id,G); }
async function listGames(){ const all=await DB.all('games'); return (all||[]).sort((a,b)=>(b.updated||0)-(a.updated||0)); }
function freshState(g){ const aff={}; (g.chars||[]).forEach(c=>aff[c.id]=0); const flags={}; (g.flags||[]).forEach(f=>flags[f.key]=+f.init||0);
  return {flags,aff,clues:{},secrets:{},done:{},seen:{},picks:[],chatAff:{},ended:null,endingScript:'',endingTitle:''}; }
const charById=id=>G.chars.find(c=>c.id===id);
function charByName(n){ n=String(n||'').trim(); if(!n) return null; return G.chars.find(c=>c.name===n)||G.chars.find(c=>c.name.split(' ')[0]===n||c.name.replace(/\s/g,'')===n.replace(/\s/g,''))||null; }
const PALETTE=['#8FD6D6','#E2C17A','#C9A6E8','#9CC98A','#E8A59A','#9DB6F0','#E3B6D0','#B9C7A3'];
function initial(n){ return String(n||'?').trim().charAt(0); }
// 그림이 없으면 M3 컨테이너 색 세 가지를 돌아가며 써요
const TONES=['primary','secondary','tertiary'];
function toneOf(c){ let h=0; for(const ch of String(c.name||'')) h=(h*31+ch.charCodeAt(0))>>>0; return TONES[h%3]; }
function toneCSS(c){ const t=toneOf(c); return `background-color:var(--md-${t}-container);color:var(--md-on-${t}-container)`; }
function avHTML(c,cls=''){ const s=imgSrc(c.img); return `<div class="av ${cls}" style="${s?`background-image:url('${s}')`:toneCSS(c)}" aria-hidden="true">${s?'':esc(initial(c.name))}</div>`; }

/* ============ 조건과 효과 ============ */
// 조건: [{k,op,v}] 모두 참이면 참. k는 플래그 키, "clue:F1", "aff:이름"
function condVal(k){ const S=G.state; k=String(k).trim();
  if(k.startsWith('clue:')) return S.clues[k.slice(5).trim()]?1:0;
  if(k.startsWith('aff:')){ const c=charByName(k.slice(4)); return c?(S.aff[c.id]||0):0; }
  return +(S.flags[k]||0); }
function condOk(list){ return (list||[]).every(c=>{ if(!c||!c.k) return true; const a=condVal(c.k), v=+(c.v??1), op=c.op||'>=';
  return op==='>='?a>=v:op==='<='?a<=v:op==='>'?a>v:op==='<'?a<v:op==='!='?a!==v:a===v; }); }
function parseCond(s){ // "trust_x>=2 그리고 clue:F1, !accused"
  return String(s||'').split(/\s*(?:&&|그리고|,|&)\s*/).map(x=>x.trim()).filter(Boolean).map(x=>{
    let neg=false; if(x.startsWith('!')){ neg=true; x=x.slice(1).trim(); }
    const m=x.match(/^(.+?)\s*(>=|<=|==|!=|=|>|<)\s*(-?\d+)$/);
    if(m) return {k:m[1].trim(),op:m[2]==='='?'==':m[2],v:+m[3]};
    return neg?{k:x,op:'==',v:0}:{k:x,op:'>=',v:1}; }); }
function condTxt(list){ return (list||[]).map(c=>`${c.k} ${c.op||'>='} ${c.v??1}`).join(' 그리고 ')||'항상'; }
// 효과: "trust_x+1", "accused=1", "aff:이름+2", "clue:F1"
function applyEffect(e){ const S=G.state; e=String(e||'').trim(); if(!e) return null; let m;
  if((m=e.match(/^clue\s*:\s*(\w+)$/))) return unlockClue(m[1]);
  if((m=e.match(/^aff\s*:\s*(.+?)\s*([+-]=?|=)\s*(-?\d+)$/))){ const c=charByName(m[1]); if(c){ const d=+m[3]; S.aff[c.id]=clamp(m[2]==='='?d:(S.aff[c.id]||0)+(m[2].startsWith('-')?-d:d),0,10); } return null; }
  if((m=e.match(/^([A-Za-z_][\w]*)\s*([+-]=?|=)\s*(-?\d+)$/))){ const k=m[1], d=+m[3]; S.flags[k]=m[2]==='='?d:(+(S.flags[k]||0))+(m[2].startsWith('-')?-d:d); return null; }
  if((m=e.match(/^([A-Za-z_][\w]*)$/))){ S.flags[m[1]]=1; return null; }
  return null; }
function unlockClue(id){ const f=(G.truth.facts||[]).find(x=>x.id===id); if(!f||G.state.clues[id]) return null; G.state.clues[id]=Date.now(); return f; }
// 상태가 바뀔 때마다 비밀 해금을 확인해요. 새로 열린 것을 돌려줘요
function unlockCheck(quiet){ const out=[]; G.chars.forEach(c=>(c.secrets||[]).forEach(s=>{ if(!G.state.secrets[s.id]&&condOk(s.when)){ G.state.secrets[s.id]=Date.now(); out.push({c,s}); } }));
  if(!quiet) out.forEach(({c})=>toast(`${c.name}의 비밀 하나가 열렸어요`,'gold')); return out; }
function lockHint(when){ const ks=(when||[]).map(c=>String(c.k)); if(ks.some(k=>k.startsWith('aff:'))) return '더 가까워지면'; if(ks.some(k=>k.startsWith('clue:'))) return '관련 단서를 찾으면'; return '이야기가 진행되면'; }

/* ============ 프롬프트 템플릿 ============
   {{이름}} 자리에 값이 들어가요. 템플릿마다 쓸 수 있는 이름이 정해져 있고,
   목록에 없는 이름은 채워지지 않아요(톡 프롬프트에 {{진실}}을 적어도 진실이 새지 않게).

const tplOf=key=>{ const t=(SET.prompts||{})[key]; return typeof t==='string'&&t.trim()?t:PROMPT_DEFS[key].def; };

function placeholders(t){ return [...new Set([...String(t).matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1]))]; }
function unknownVars(key,t){ const ok=PROMPT_DEFS[key].vars; return placeholders(t).filter(k=>!(k in ok)); }

/* ============ 네트워크 (중계 서버를 켜면 그걸 거쳐요) ============ */
async function net(url,init={},timeout=180000){
  const relay=String(SET.ai.relay||'').trim().replace(/\/+$/,'');
  const target=relay?relay+'/?u='+encodeURIComponent(url):url;
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),timeout);
  try{ return await fetch(target,{...init,signal:ac.signal}); }
  catch(e){ throw new AppErr('network',ac.signal.aborted?'응답이 너무 오래 걸려 멈췄어요. 다시 시도해 주세요.':(relay?'중계 서버에 연결하지 못했어요. 주소를 확인해 주세요.':'연결하지 못했어요. 인터넷을 확인하거나, 브라우저가 막는 경우 설정에서 중계 서버를 켜 주세요.')); }
  finally{ clearTimeout(t); }
}

/* ============ Vertex AI 서비스 계정 ============ */
// 키 파일 전체를 붙여넣으면 필요한 값을 알아서 꺼내요
function parseSA(text){
  const t=String(text||'').trim(); if(!t) return {empty:true,err:'서비스 계정 키(JSON)를 붙여넣어 주세요.'};
  const tries=[t]; const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) tries.push(t.slice(a,b+1));
  tries.push(...tries.map(s=>s.replace(/\r?\n/g,'\\n'))); // 줄바꿈이 깨진 채로 붙여넣은 경우
  let j=null; for(const s of tries){ try{ j=JSON.parse(s); if(j&&typeof j==='object') break; }catch(e){ j=null; } }
  if(!j) return {err:'JSON으로 읽을 수 없어요. 다운로드한 키 파일 내용을 처음 { 부터 마지막 } 까지 그대로 붙여넣어 주세요.'};
  if(j.type&&j.type!=='service_account') return {err:`서비스 계정 키가 아니에요(type: ${j.type}). IAM → 서비스 계정 → 키 → JSON으로 만든 파일이 필요해요.`};
  if(!j.client_email||!j.private_key) return {err:'client_email이나 private_key가 없어요. 키 파일 전체를 붙여넣어 주세요.'};
  if(!/BEGIN PRIVATE KEY/.test(j.private_key)) return {err:'private_key 형식이 올바르지 않아요.'};
  return {project:j.project_id||'',email:j.client_email,keyId:j.private_key_id||'',pk:j.private_key,tokenUri:j.token_uri||'https://oauth2.googleapis.com/token'};
}
const b64url=u8=>{ let s=''; u8.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64ToBytes=b=>{ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
let TOK=null;
async function vertexToken(force){
  const sa=parseSA(SET.ai.sa); if(sa.err) throw new AppErr('sa',sa.err);
  const now=Math.floor(Date.now()/1000);
  if(!force&&TOK&&TOK.email===sa.email&&TOK.exp>now+120) return TOK.tok;
  const enc=o=>b64url(new TextEncoder().encode(JSON.stringify(o)));
  const unsigned=enc({alg:'RS256',typ:'JWT',kid:sa.keyId||undefined})+'.'+enc({iss:sa.email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:sa.tokenUri,iat:now,exp:now+3600});
  let key; try{ const der=b64ToBytes(sa.pk.replace(/-----[^-]+-----/g,'').replace(/\\n|\s+/g,'')); key=await crypto.subtle.importKey('pkcs8',der,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']); }
  catch(e){ throw new AppErr('sa','private_key를 읽지 못했어요. 키 파일을 다시 붙여넣어 주세요.'); }
  const sig=new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,new TextEncoder().encode(unsigned)));
  const r=await net(sa.tokenUri,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+b64url(sig)}).toString()},30000);
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j.access_token) throw new AppErr('auth',`토큰을 받지 못했어요(${r.status}). ${j.error_description||j.error||''} 키가 삭제됐거나 비활성화됐는지 확인해 주세요.`);
  TOK={tok:j.access_token,exp:now+(j.expires_in||3600),email:sa.email};
  return TOK.tok;
}

/* AI가 돌려준 글에서 JSON만 꺼내요 */
function parseLoose(text){
  let t=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{ return JSON.parse(t); }catch(e){}
  const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?1e9:i;})), b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a<1e9&&b>a){ const s=t.slice(a,b+1); try{ return JSON.parse(s); }catch(e){} try{ return JSON.parse(s.replace(/,\s*([}\]])/g,'$1')); }catch(e){} }
  throw new AppErr('json','AI 응답을 읽지 못했어요.');
}

const GEM_HELP={400:'요청 형식이 거절됐어요.',401:'인증이 거절됐어요. 키를 다시 붙여넣어 주세요.',403:'권한이 없어요. 프로젝트에서 Vertex AI API가 켜져 있는지, 서비스 계정에 "Vertex AI 사용자" 역할이 있는지 확인해 주세요.',404:'모델을 찾지 못했어요. 모델 이름이나 지역을 확인해 주세요(지역은 global을 권해요).',429:'요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.'};
// tier: 'main'(글쓰기) | 'quick'(요약·채팅)
async function gem(prompt,{tier='main',maxTokens,temperature=1,retryJson=true}={}){
  if(window.__MOCK_GEM) return window.__MOCK_GEM(prompt,tier);
  const sa=parseSA(SET.ai.sa); if(sa.err) throw new AppErr('sa',sa.err);
  if(!sa.project) throw new AppErr('sa','키 파일에 project_id가 없어요.');
  const region=String(SET.ai.region||'global').trim()||'global';
  const host=region==='global'?'aiplatform.googleapis.com':`${region}-aiplatform.googleapis.com`;
  const model=String((tier==='quick'?(SET.ai.quick||SET.ai.model):SET.ai.model)||'').trim();
  if(!model) throw new AppErr('model','설정에서 모델 이름을 넣어 주세요.');
  const url=`https://${host}/v1/projects/${encodeURIComponent(sa.project)}/locations/${encodeURIComponent(region)}/publishers/google/models/${encodeURIComponent(model)}:generateContent`;
  const P=prompt+'\n\n설명이나 코드 블록 없이 JSON만 출력한다. 문자열 안에 따옴표가 필요하면 「」나 작은따옴표를 쓴다.';
  const body={contents:[{role:'user',parts:[{text:P}]}],
    generationConfig:{temperature,maxOutputTokens:maxTokens||(tier==='quick'?4096:32768),responseMimeType:'application/json'},
    safetySettings:['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH','HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'].map(category=>({category,threshold:'BLOCK_ONLY_HIGH'}))};
  let last;
  for(let a=0;a<3;a++){
    const tok=await vertexToken(a>0&&last&&last.code==='auth');
    const r=await net(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(body)},tier==='quick'?90000:300000);
    let j={}; try{ j=await r.json(); }catch(e){}
    if(r.status===401){ last=new AppErr('auth',GEM_HELP[401]); TOK=null; continue; }
    if(r.status===429||r.status>=500){ last=new AppErr('busy',(GEM_HELP[r.status]||`Gemini 서버 오류(${r.status}).`)+' '); await wait(1500*(a+1)); continue; }
    if(!r.ok) throw new AppErr('gem',`${GEM_HELP[r.status]||'Gemini 요청 실패.'} (${r.status}${j.error&&j.error.message?': '+String(j.error.message).slice(0,160):''})`);
    if(j.promptFeedback&&j.promptFeedback.blockReason) throw new AppErr('refused','Gemini가 이 요청을 거절했어요. 표현을 조금 바꿔 다시 시도해 주세요.');
    const c=(j.candidates||[])[0];
    if(!c) throw new AppErr('refused','Gemini 응답이 비어 있어요.');
    if(['SAFETY','PROHIBITED_CONTENT','BLOCKLIST','SPII'].includes(c.finishReason)) throw new AppErr('refused','Gemini가 안전 필터로 응답을 막았어요. 설정을 조금 순하게 바꿔 보세요.');
    const text=((c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
    try{ return parseLoose(text); }
    catch(e){ last=new AppErr('json',c.finishReason==='MAX_TOKENS'?'응답이 길이 제한에 걸렸어요. 분량을 줄여 보세요.':'AI 응답을 읽지 못했어요.'); if(!retryJson) break; }
  }
  throw last||new AppErr('gem','Gemini 요청 실패');
}

/* ============ NovelAI ============ */
const NAI_URL='https://image.novelai.net/ai/generate-image';
const NAI_MODELS=[['nai-diffusion-5-full','V5 Full'],['nai-diffusion-5-curated','V5 Curated'],['nai-diffusion-4-5-full','V4.5 Full'],['nai-diffusion-4-5-curated','V4.5 Curated'],['nai-diffusion-4-full','V4 Full']];
const isV5=m=>/^nai-diffusion-5/.test(String(m||''));
const tagJoin=(...a)=>a.map(x=>String(x||'').trim().replace(/^,|,$/g,'')).filter(Boolean).join(', ');
const tagList=s=>String(s||'').split(',').map(t=>t.trim()).filter(Boolean);
const BG_TAG=/^(simple background|white background|grey background|gray background|gradient background|plain background|transparent background)$/i;
// V5 자체 투명 배경을 쓸지(인물 스탠딩만)
const useTp=(kind,o={})=>kind==='char'&&SET.nai.transparent!==false&&isV5(SET.nai.model)&&!o.noTp;
// 최종 프롬프트 조립: 그림체 + 대상 태그 + 추가 태그 + 종류별 기본 태그
// o.style이 문자열이면 전체 그림체 대신 그걸 써요(캐릭터별 그림체)
function composeNai(kind,prompt,o={}){ const c=SET.nai, K=kindCfg(kind);
  const style=typeof o.style==='string'&&o.style.trim()?o.style:c.style;
  let input=tagJoin(style,prompt,o.extra,K.suffix), neg=tagJoin(c.neg,K.neg,o.neg); const tp=useTp(kind,o);
  if(tp){ input=tagJoin(tagList(input).filter(t=>!BG_TAG.test(t)).join(', '),'transparent background'); neg=tagList(neg).filter(t=>!/^(gradient background|simple background|white background)$/i.test(t)).join(', '); }
  return {input,neg,w:K.w,h:K.h,tp}; }
const naiSeed=s=>String(s??'').trim()!==''&&isFinite(+s)?(Math.floor(+s)>>>0):crypto.getRandomValues(new Uint32Array(1))[0];
function naiBase(c,neg,seed,w,h){ return {params_version:3,width:w,height:h,scale:+c.scale||6,sampler:c.sampler||'k_euler_ancestral',steps:clamp(+c.steps||28,1,50),n_samples:1,ucPreset:0,qualityToggle:false,
  noise_schedule:'karras',cfg_rescale:0,negative_prompt:neg,seed,dynamic_thresholding:false,legacy:false,add_original_image:false,prefer_brownian:true,deliberate_euler_ancestral_bug:false,use_coords:false}; }
function naiV4(P,input,neg,chars=[]){ const cc=chars.filter(x=>x&&x.prompt);
  P.v4_prompt={caption:{base_caption:input,char_captions:cc.map(x=>({char_caption:x.prompt,centers:[{x:.5,y:.5}]}))},use_coords:false,use_order:true};
  P.v4_negative_prompt={caption:{base_caption:neg,char_captions:cc.map(x=>({char_caption:x.neg||'',centers:[{x:.5,y:.5}]}))},legacy_uc:false}; }
// 요청 보내고 이미지(바이트) 받기. 바쁘면 잠시 기다렸다 다시
async function naiRequest(body){ const c=SET.nai; if(!String(c.key||'').trim()) throw new AppErr('nai','설정에서 NovelAI 토큰을 넣어 주세요.'); let last;
  for(let a=0;a<3;a++){
    const r=await net(NAI_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+String(c.key).trim()},body:JSON.stringify(body)},180000);
    if(r.ok){ const img=await unzipFirst(new Uint8Array(await r.arrayBuffer())); return new Blob([img],{type:imgType(img)||'image/png'}); }
    const txt=await r.text().catch(()=> '');
    if(r.status===401) throw new AppErr('nai','NovelAI 토큰이 올바르지 않아요.');
    if(r.status===402) throw new AppErr('nai','Anlas가 부족하거나 구독이 필요해요.');
    last=new AppErr('nai',`NovelAI 오류(${r.status}) ${txt.slice(0,160)}`);
    if(r.status===429||/Concurrent generation/i.test(txt)||r.status>=500){ await wait(2500*(a+1)); continue; }
    break; }
  throw last; }
// chars: [{prompt,neg}] 여러 인물 CG일 때 V4 캐릭터 캡션으로 따로 넣어요
async function naiDraw(prompt,kind,chars=[],o={}){
  let blob,seed,tp; const c=FRIEND?remoteArt():SET.nai;
  if(FRIEND){ const r=await remoteNai({mode:'draw',kind,prompt,extra:o.extra||'',neg:o.neg||'',style:o.style||'',seed:o.seed??'',chars,noTp:!!o.noTp}); blob=r.blob; seed=r.seed; tp=r.tp; }
  else{ const C=composeNai(kind,prompt,o), model=c.model||'nai-diffusion-5-full'; seed=naiSeed(o.seed); tp=C.tp;
    const P=naiBase(c,C.neg,seed,C.w,C.h); if(/diffusion-(4|5)/.test(model)) naiV4(P,C.input,C.neg,chars);
    if(C.tp){ P.params_version=4; P.straight_alpha=true; P.tag_hint_transparent_background=true; }
    blob=await naiRequest({input:C.input,model,action:'generate',parameters:P}); }
  if(tp){ const ai=await alphaInfo(blob);
    if(ai.solid<0.02){ // 투명 결과가 텅 비면 흰 배경으로 한 번 더
      toast('투명 배경 결과가 비어서 흰 배경으로 다시 그려요'); return naiDraw(prompt,kind,chars,{...o,noTp:true,seed}); }
    if(ai.border<0.5&&c.cutout) blob=await cutoutWhite(blob); }
  else if(kind==='char'&&c.cutout) blob=await cutoutWhite(blob);
  blob.__seed=seed; blob.__tp=tp; return blob; }
// 인페인팅: image·mask는 base64 PNG, 크기는 64의 배수
async function naiInpaint(input,neg,image,mask,w,h,o={}){
  const c=SET.nai; let model=o.model||c.inpaintModel||(isV5(c.model)?c.model:'nai-diffusion-5-full'); if(!/-inpainting$/.test(model)) model+='-inpainting';
  const seed=naiSeed(o.seed), P=naiBase(c,neg,seed,w,h); naiV4(P,input,neg);
  Object.assign(P,{image,mask,strength:1,noise:0,inpaintImg2ImgStrength:1,add_original_image:false,img2img:{strength:1,begin_from_sigma:null,noise:0,extra_noise_seed:seed,color_correct:true}});
  return naiRequest({input,model,action:'infill',parameters:P}); }
// border: 가장자리 중 투명한 비율, solid: 전체 중 불투명한 비율
async function alphaInfo(blob){
  try{ const bmp=await createImageBitmap(blob), W=bmp.width, H=bmp.height, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d',{willReadFrequently:true}); x.drawImage(bmp,0,0); const d=x.getImageData(0,0,W,H).data; let n=0,t=0,s=0,m=0;
    for(let i=0;i<W;i+=3){ n+=2; if(d[i*4+3]<24)t++; if(d[((H-1)*W+i)*4+3]<24)t++; } for(let j=0;j<H;j+=3){ n+=2; if(d[(j*W)*4+3]<24)t++; if(d[(j*W+W-1)*4+3]<24)t++; }
    for(let p=3;p<d.length;p+=64){ m++; if(d[p]>128)s++; }
    return {border:n?t/n:0,solid:m?s/m:1}; }catch(e){ return {border:0,solid:1}; } }
function imgType(u8){ if(!u8||u8.length<12) return ''; if(u8[0]===0x89&&u8[1]===0x50) return 'image/png'; if(u8[0]===0xFF&&u8[1]===0xD8) return 'image/jpeg'; if(u8[0]===0x52&&u8[8]===0x57) return 'image/webp'; return ''; }
async function unzipFirst(u8){
  if(imgType(u8)) return u8;
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); let e=u8.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new AppErr('nai','NovelAI 응답을 풀지 못했어요.');
  const cd=dv.getUint32(e+16,true), method=dv.getUint16(cd+10,true), size=dv.getUint32(cd+20,true), lho=dv.getUint32(cd+42,true);
  const st=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true), data=u8.subarray(st,st+size);
  if(method===0) return data;
  return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}
// 흰 배경을 가장자리부터 지워서 스탠딩처럼 보이게
async function cutoutWhite(blob){
  try{ const bmp=await createImageBitmap(blob), W=bmp.width, H=bmp.height, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d',{willReadFrequently:true}); x.drawImage(bmp,0,0); const im=x.getImageData(0,0,W,H), d=im.data;
    const white=i=>d[i]>232&&d[i+1]>232&&d[i+2]>232, seen=new Uint8Array(W*H), q=[];
    const push=p=>{ if(!seen[p]&&white(p*4)){ seen[p]=1; q.push(p); } };
    for(let i=0;i<W;i++){ push(i); push((H-1)*W+i); } for(let j=0;j<H;j++){ push(j*W); push(j*W+W-1); }
    while(q.length){ const p=q.pop(), px=p%W, py=(p-px)/W; d[p*4+3]=0; if(px>0) push(p-1); if(px<W-1) push(p+1); if(py>0) push(p-W); if(py<H-1) push(p+W); }
    for(let p=0;p<W*H;p++){ if(seen[p]) continue; const px=p%W; const nb=(px>0&&seen[p-1])||(px<W-1&&seen[p+1])||(p>=W&&seen[p-W])||(p<W*H-W&&seen[p+W]); if(nb&&d[p*4]>200&&d[p*4+1]>200&&d[p*4+2]>200) d[p*4+3]=110; }
    x.putImageData(im,0,0); return await new Promise(r=>cv.toBlob(b=>r(b||blob),'image/png')); }catch(e){ return blob; }
}

/* ============ 생성 파이프라인 ============
   원칙: 진실·비밀·엔딩 조건은 게임 데이터에만 있고 화면에는 나오지 않아요.
   글쓰기 AI는 진실을 알고 단서를 심지만, 톡 AI는 플레이어가 해금한 것만 받아요.
   프롬프트 문장은 prompts.js의 템플릿(설정에서 고칠 수 있음)에서 와요. */

const LEN={short:'25~40줄',normal:'40~65줄',long:'65~100줄'};
// 공통 규칙은 값만 모아 두고, 채우는 건 genAI(개인용: 이 기기, 배포판: 서버)가 해요
function rulesVars(m){ return {'호칭':m.call,'이름안내':m.player?`플레이어의 이름은 ${m.player}이고, 이름은 친밀한 순간에만 부른다.`:'',
  '플레이어설정':m.playerNote||'따로 없음','분위기':m.tone||'장르에 맞게'}; }
const rulesTxt=(g=G)=>fillPrompt('rules',rulesVars(g.meta));
function castTxt(g,{secrets=false}={}){ return g.chars.map(c=>`- ${c.name} (${c.role}) 외모: ${c.look} / 공개 프로필: ${c.profile} / 말투: ${c.speech} / 남들에게 내세우는 입장: ${c.front}`
  +((c.faces||[]).some(f=>f.img)?` / 표정(대사에 [표정]으로 쓴다): ${c.faces.filter(f=>f.img).map(f=>f.name).join('/')}`:'')
  +(secrets?`\n  비밀: ${(c.secrets||[]).map(s=>`[${s.id}] ${s.text} (플레이어에게 해금되는 조건: ${condTxt(s.when)})`).join(' / ')||'없음'}`:'')).join('\n'); }
function truthTxt(g){ const t=g.truth; return `【숨겨진 진실 — 작가만 안다. 대사나 나레이션으로 직접 폭로하지 말고, 계획된 장에서 단서로만 흘린다】
핵심 진실: ${t.core}
사실(단서) 목록: ${(t.facts||[]).map(f=>`${f.id} 「${f.title}」 ${f.text}`).join(' / ')}
플래그: ${(g.flags||[]).map(f=>`${f.key}(${f.label}, 초기 ${f.init})`).join(', ')||'없음'}. 호감도 aff:이름 은 0~10.
엔딩(위에서부터 먼저 맞는 것): ${(g.endings||[]).map(e=>`「${e.title}」 조건: ${condTxt(e.when)} — ${e.gist}`).join(' / ')}`; }
function planTxt(g){ return (g.plan||[]).map((p,i)=>`${i+1}장 「${p.title}」: ${p.goal}`).join('\n'); }
function stateTxt(g){ const S=g.state;
  const fl=Object.entries(S.flags).map(([k,v])=>`${k}=${v}`).join(', ')||'없음';
  const af=g.chars.map(c=>`${c.name} ${S.aff[c.id]||0}`).join(', ');
  const cl=(g.truth.facts||[]).filter(f=>S.clues[f.id]).map(f=>f.id).join(', ')||'없음';
  const sc=g.chars.flatMap(c=>(c.secrets||[]).filter(s=>S.secrets[s.id]).map(s=>s.id)).join(', ')||'없음';
  const picks=S.picks.slice(-24).map(p=>`${p.where}: "${p.text}"`).join(' / ')||'없음';
  return `【현재 플레이 상태】 플래그: ${fl}\n호감도: ${af}\n플레이어가 찾은 단서: ${cl}\n플레이어가 알게 된 비밀: ${sc}\n플레이어의 지난 선택: ${picks}`; }
function storySoFar(g){ return g.chapters.filter(c=>c&&c.summary).map((c,i)=>`${i+1}장 「${c.title}」: ${c.summary}`).join('\n')||'(아직 없음)'; }
function worldHead(){ return `게임 "${G.meta.title}" — 장르: ${G.meta.genre||'자유'}. 세계 「${G.world.name}」: ${G.world.summary}`; }
// 글쓰기 프롬프트가 공통으로 받는 값(진실 포함)
function writerVars(){ const g=G; return {__rules:rulesVars(g.meta),'호칭':g.meta.call,'게임제목':g.meta.title,'장르':g.meta.genre||'자유','세계':worldHead(),
  '인물_작가용':castTxt(g,{secrets:true}),'진실':truthTxt(g),'장계획':planTxt(g),'지난이야기':storySoFar(g),'플레이상태':stateTxt(g),'배경목록':Object.keys(g.lib.bg).join(', ')||'없음','직전장면':lastSeenTail(14)||'(없음. 이야기의 시작이다)'}; }

/* ---------- 1. 새 게임: 세계·인물·숨겨진 진실 ---------- */
async function genWorld(form,step){
  const sexRule={m:'주요 인물은 모두 남성(naiPrompt는 1boy로 시작)',f:'주요 인물은 모두 여성(naiPrompt는 1girl로 시작)',mix:'여성과 남성을 섞는다'}[form.castSex]||'성별은 이야기에 맞게 정한다';
  step('세계와 인물, 숨겨진 진실을 만드는 중');
  const r=await genAI('world',{__rules:rulesVars(form),'장르':form.genre||'자유','아이디어':form.idea||'자유','꼭넣기':form.must||'없음','분위기':form.tone||'장르에 맞게','인물수':form.cast,'성별규칙':sexRule,'장수':form.chapters},{tier:'main'});

}
function buildGame(form,r){
  if(!r||!Array.isArray(r.characters)||!r.characters.length||!r.truth) throw new AppErr('json','AI가 게임 설계를 끝까지 주지 않았어요. 다시 시도해 주세요.');
  const chars=r.characters.slice(0,8).map((c,i)=>({id:'c'+uid(),name:String(c.name||'인물'+(i+1)).trim().slice(0,20),role:String(c.role||'').slice(0,20),look:String(c.look||''),naiPrompt:String(c.naiPrompt||''),speech:String(c.speech||''),profile:String(c.profile||''),front:String(c.front||''),color:PALETTE[i%PALETTE.length],img:null,secrets:[]}));
  r.characters.slice(0,8).forEach((c,i)=>{ chars[i].secrets=(Array.isArray(c.secrets)?c.secrets:[]).slice(0,3).map((s,k)=>({id:`S${i+1}${String.fromCharCode(97+k)}`,text:String(s.text||s||''),when:normCond(s.when)})).filter(s=>s.text); });
  const facts=(r.truth.facts||[]).map((f,i)=>({id:String(f.id||'F'+(i+1)).replace(/[^\w]/g,'')||'F'+(i+1),title:String(f.title||'단서'),text:String(f.text||'')}));
  const flags=(r.flags||[]).map(f=>({key:String(f.key||'').replace(/[^\w]/g,'').toLowerCase(),label:String(f.label||''),init:+f.init||0})).filter(f=>f.key&&/^[a-z_]/.test(f.key));
  const endings=(r.endings||[]).map((e,i)=>({id:String(e.id||'E'+(i+1)),title:String(e.title||'엔딩'),when:normCond(e.when),gist:String(e.gist||'')}));
  if(!endings.length||endings[endings.length-1].when.length) endings.push({id:'E0',title:'열린 결말',when:[],gist:'진실의 일부만 남은 채 이야기가 끝난다.'});
  const bg={}; (r.backgrounds||[]).forEach(b=>{ const n=String(b.name||'').trim(); if(n&&!bg[n]) bg[n]={prompt:String(b.prompt||''),img:null}; });
  const g={id:'g'+uid(),created:Date.now(),updated:Date.now(),
    meta:{title:String(r.title||'이름 없는 이야기'),sub:String(r.sub||''),logline:String(r.logline||''),genre:form.genre,tone:form.tone,idea:form.idea,must:form.must,call:form.call||'당신',player:form.player||'',playerNote:form.playerNote||'',castSex:form.castSex,chapters:+form.chapters,stages:+form.stages,len:form.len},
    world:{name:String(r.world?.name||''),summary:String(r.world?.summary||'')},
    chars,truth:{core:String(r.truth.core||''),facts},flags,endings,
    plan:(r.plan||[]).slice(0,+form.chapters).map(p=>({title:String(p.title||''),goal:String(p.goal||'')})),
    lib:{bg,cg:{}},chapters:[],chats:{},author:false};
  while(g.plan.length<+form.chapters) g.plan.push({title:'',goal:'이야기를 이어 간다'});
  g.state=freshState(g);
  return g;
}
function normCond(w){ if(typeof w==='string') return parseCond(w); return (Array.isArray(w)?w:[]).filter(c=>c&&c.k).map(c=>({k:String(c.k).trim(),op:['>=','<=','==','!=','>','<'].includes(c.op)?c.op:(c.op==='='?'==':'>='),v:c.v==null||c.v===''?1:+c.v})); }

/* ---------- 2. 장 집필: 구성 → 스테이지마다 대본 ---------- */
async function genChapter(idx,step){
  const g=G, p=g.plan[idx]||{title:'',goal:''}, last=idx===g.meta.chapters-1, ns=clamp(+g.meta.stages||3,1,5);
  step(`${idx+1}장 구성을 짜는 중`);
  const prevTail=lastSeenTail(14);
  const o=await genAI('outline',{...writerVars(),'장번호':idx+1,'장제목':p.title||`${idx+1}장`,'이번장계획':p.goal,'장면수':ns,
    '마지막장지침':last?'- 마지막 장이다. 마지막 스테이지에 엔딩을 가르는 결정적 선택을 넣는다. 진실을 완전히 폭로하지 말고 결정의 순간에서 끝낸다(엔딩은 따로 쓴다).':''},{tier:'main'});
  if(!o||!Array.isArray(o.stages)||!o.stages.length) throw new AppErr('json','장 구성을 받지 못했어요. 다시 시도해 주세요.');
  (o.backgrounds||[]).forEach(b=>{ const n=String(b.name||'').trim(); if(n&&!g.lib.bg[n]) g.lib.bg[n]={prompt:String(b.prompt||''),img:null}; });
  const chId='h'+uid();
  (o.cgs||[]).forEach(c=>{ const n=String(c.name||'').trim(); if(n&&!g.lib.cg[n]) g.lib.cg[n]={prompt:String(c.prompt||''),cast:(c.cast||[]).map(String),img:null,ch:chId}; });
  const ch={id:chId,idx,title:String(o.title||p.title||`${idx+1}장`),stages:o.stages.slice(0,ns).map(s=>({id:'s'+uid(),title:String(s.title||''),beats:(s.beats||[]).map(String),reveals:(s.reveals||[]).map(String),script:''})),summary:''};
  const outline=ch.stages.map((s,i)=>`${i+1}. ${s.title}: ${s.beats.join(' / ')} (풀 단서: ${s.reveals.join(', ')||'없음'})`).join('\n');
  let tail=prevTail;
  for(let i=0;i<ch.stages.length;i++){
    const s=ch.stages[i]; step(`${idx+1}장 집필 중 ${i+1}/${ch.stages.length} · ${s.title}`);
    const w=await genAI('stage',{...writerVars(),'대본형식':SCRIPT_RULES(g.meta.call),'CG목록':Object.entries(g.lib.cg).filter(([,v])=>v.ch===chId).map(([k])=>k).join(', ')||'없음',
      '장번호':idx+1,'장제목':ch.title,'장구성':outline,'장면번호':i+1,'장면제목':s.title,'장면구성':s.beats.map((b,k)=>(k+1)+') '+b).join(' ')||'(자유롭게)',
      '앞장면':tail||'(없음. 이 장면에서 시작한다)','분량':LEN[g.meta.len]||LEN.normal,'풀단서':s.reveals.join(', ')||'없음'},{tier:'main'});
    s.script=normScript(w&&w.script);
    if(!s.script) throw new AppErr('json',`스테이지 ${i+1} 대본을 받지 못했어요. 다시 시도해 주세요.`);
    tail=s.script.split('\n').slice(-14).join('\n');
  }
  g.chapters[idx]=ch; await saveG();
  if(SET.nai.auto&&SET.nai.key) autoArt(step).catch(()=>{});
  return ch;
}
function normScript(s){ if(Array.isArray(s)) s=s.map(x=>typeof x==='string'?x:(x&&(x.name||x.speaker)?`${x.name||x.speaker}: ${x.text||x.line||''}`:String(x&&x.text||''))).join('\n'); return String(s||'').replace(/\\n/g,'\n').replace(/\r/g,'').trim(); }
function lastSeenTail(n){ const S=G.state; for(let i=G.chapters.length-1;i>=0;i--){ const ch=G.chapters[i]; if(!ch) continue; for(let k=ch.stages.length-1;k>=0;k--){ const v=S.seen[ch.stages[k].id]; if(v&&v.length) return v.slice(-n).join('\n'); } } return ''; }

/* ---------- 3. 장 요약: 플레이어가 실제로 본 줄만으로 (진실이 새지 않게) ---------- */

/* ---------- 5. 자유 채팅: 해금된 것만 아는 캐릭터 ---------- */
async function genChat(c,text){
  const S=G.state, f=G.chats[c.id]=G.chats[c.id]||{log:[],sum:'',sumTo:0};
  const mySecrets=(c.secrets||[]).filter(s=>S.secrets[s.id]).map(s=>s.text);
  const clues=(G.truth.facts||[]).filter(x=>S.clues[x.id]).map(x=>`「${x.title}」 ${x.text}`);
  const recent=f.log.slice(-20).map(l=>l.w==='me'?`${G.meta.call}: ${l.t}`:l.w==='c'?`${c.name}: ${l.t}`:`(${l.t})`).join('\n');
  const curSeen=(()=>{ const ch=G.chapters.find(h=>h&&!h.summary&&h.stages.some(s=>S.done[s.id])); return ch?ch.stages.map(s=>(S.seen[s.id]||[]).slice(-12).join('\n')).join('\n'):''; })();
  // 톡에는 진실·안 열린 비밀을 담은 값이 아예 없어요
  const r=await genAI('chat',{__rules:rulesVars(G.meta),'호칭':G.meta.call,'게임제목':G.meta.title,'세계':`게임 "${G.meta.title}" 세계 「${G.world.name}」: ${G.world.summary}`,
    '캐릭터':c.name,'역할':c.role,'프로필':c.profile,'말투':c.speech,'겉입장':c.front,'털어놓은비밀':mySecrets.join(' / ')||'없음','찾은단서':clues.join(' / ')||'없음',
    '지난이야기':storySoFar(G),'최근장면':curSeen||'(없음)','호감도':S.aff[c.id]||0,'예전대화':f.sum||'없음','최근대화':recent||'(없음)','메시지':text},{tier:'quick',temperature:1});
  const replies=(Array.isArray(r&&r.replies)?r.replies:[String(r&&r.reply||'…')]).map(String).filter(Boolean).slice(0,4);
  // 채팅만으로 호감도를 무한히 올리지 못하게 장마다 +3까지
  const chKey=c.id+':'+G.chapters.filter(Boolean).length, used=S.chatAff[chKey]||0; let d=clamp(Math.round(+r?.aff||0),-1,2); if(d>0) d=Math.min(d,3-used);
  if(d){ S.aff[c.id]=clamp((S.aff[c.id]||0)+d,0,10); if(d>0) S.chatAff[chKey]=used+d; }
  return {replies,d};
}
async function chatSummarize(c){ const f=G.chats[c.id]; if(!f) return; const end=f.log.length-20, part=f.log.slice(f.sumTo||0,end); if(part.length<16) return;
  try{ const r=await genAI('chatsum',{'캐릭터':c.name,'호칭':G.meta.call,'기존요약':f.sum||'없음','새대화':part.map(l=>(l.w==='me'?G.meta.call:c.name)+': '+l.t).join('\n')},{tier:'quick'});
    if(r&&r.summary){ f.sum=String(r.summary).slice(0,1200); f.sumTo=end; } }catch(e){} }

// CG에는 캐릭터의 외형 태그와 'CG에도 쓰는 태그'가 캐릭터 캡션으로 들어가요

let ART_BUSY=false;
async function autoArt(step=()=>{}){ if(ART_BUSY) return; ART_BUSY=true; const g=G;
  try{ for(const c of g.chars){ if(G!==g) return; if(!c.img){ step(`${c.name} 그리는 중`); await drawChar(c); } }
    for(const k of ['bg','cg']) for(const n of Object.keys(g.lib[k])){ if(G!==g) return; if(!g.lib[k][n].img){ await drawLib(k,n); } }
    if(typeof refresh==='function') refresh(); }
  catch(e){ toast('그림 자동 생성 중단: '+e.message,'err'); }
  finally{ ART_BUSY=false; } }

/* ============ 대본 파서 ============ */
function parseChoiceOpt(s){ const fx=[]; const text=s.replace(/\{([^}]*)\}/g,(_,x)=>{ x.split(/[,，;]/).map(t=>t.trim()).filter(Boolean).forEach(t=>fx.push(t)); return ''; }).trim(); return {text,fx}; }
function parseLine(raw){
  let l=String(raw).trim(), pick=0, cond=null, m;
  for(let k=0;k<2;k++){
    if((m=l.match(/^[(\[（]?([1-9])\s*[)\]）]\s*(.+)$/))&&!/^\[[^\]]*[:：]/.test(l)){ pick=+m[1]; l=m[2].trim(); continue; }
    if((m=l.match(/^\[만약\s+([^\]]+)\]\s*(.*)$/))){ cond=parseCond(m[1]); l=m[2].trim(); continue; }
  }
  let o;
  if(!l) o={type:'skip'};
  else if(/^\[CG\s*끝\]$/i.test(l)) o={type:'cmd',cmd:'CG끝'};
  else if((m=l.match(/^\[효과\s*[:：]\s*암전\s*끝\]$/))) o={type:'cmd',cmd:'효과',arg:'암전 끝'};
  else if((m=l.match(/^\[(배경|CG|효과|설정|단서|음악|효과음|소품|톡|사진)\s*[:：]\s*(.+?)\]$/i))) o={type:'cmd',cmd:m[1].toUpperCase()==='CG'?'CG':m[1],arg:m[2].trim()};
  else if(/^\[(음악|소품|톡)\s*끝\]$/.test(l)) o={type:'skip'};
  else if((m=l.match(/^\[([^\]:：]{1,30})\]$/))) o={type:'place',text:m[1].trim()};
  else if((m=l.match(/^선택\s*[:：]\s*(.+)$/))) o={type:'choice',opts:m[1].split('|').map(s=>parseChoiceOpt(s)).filter(x=>x.text)};
  else if((m=l.match(/^([^:：\[\]]{1,20}?)\s*(?:\[([^\]]{1,12})\])?\s*[:：]\s*(.+)$/))) o={type:'say',who:m[1].trim(),face:m[2]||'',text:m[3].trim()};
  else o={type:'nar',text:l};
  o.pick=pick; o.cond=cond; return o;
}
function parseScript(t){ return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map(parseLine).filter(o=>o.type!=='skip'); }
const isMe=w=>{ const n=String(w||'').trim(); return n===G.meta.call||(G.meta.player&&n===G.meta.player)||n==='나'||n==='플레이어'; };
const subName=s=>String(s||'').replace(/\{(플레이어|이름|player)\}/g,G.meta.player||G.meta.call).replace(new RegExp('\\{'+G.meta.call+'\\}','g'),G.meta.player||G.meta.call);

/* ============ 재생기 ============ */
let V=null;
function hashHue(s){ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return h%360; }
function bgCSS(name){ const it=G.lib.bg[name]||G.lib.bg[Object.keys(G.lib.bg).find(k=>name&&(k.includes(name)||name.includes(k)))||'']; const s=it&&imgSrc(it.img);
  if(s) return `background-image:url('${s}')`; const h=hashHue(name||'x');
  return `background:radial-gradient(120% 90% at 30% 15%,hsl(${h} 18% 32%),hsl(${(h+30)%360} 14% 14%) 62%,#0d0f08)`; }
// 한 스테이지(또는 엔딩) 재생. onEnd(seenLines)
function playScript(title,script,onEnd,opt={}){
  const lines=parseScript(script);
  V={title,lines,i:0,pick:0,typing:false,full:'',timer:null,auto:false,autoT:null,choice:null,seen:[],log:[],onEnd,opt,cg:null};
  const el=document.createElement('div'); el.className='vn force-dark'; el.id='vn'; el.setAttribute('role','dialog'); el.setAttribute('aria-label',title);
  el.innerHTML=`<div class="vn-bg" id="vnBg"></div><div class="vn-black" id="vnBlack"></div><div class="vn-char dim" id="vnChar"></div><div class="vn-cg" id="vnCG" hidden></div>
  <div class="vn-top"><span class="t title-s">${esc(title)}</span><button class="ibtn sl" id="vnAuto" aria-label="자동 진행" title="자동 진행">${ic('play_arrow')}</button><button class="ibtn sl" id="vnLogB" aria-label="대사 기록" title="대사 기록">${ic('history')}</button><button class="ibtn sl" id="vnSkip" aria-label="다음 선택지까지 넘기기" title="다음 선택지까지 넘기기">${ic('fast_forward')}</button><button class="ibtn sl" id="vnQuit" aria-label="나가기" title="나가기">${ic('close')}</button></div>
  <div class="vn-place chip" id="vnPlace"></div><div class="vn-flash" id="vnFlash"></div>
  <div class="vn-choices" id="vnCh" role="group" aria-label="선택지"></div>
  <div class="vn-box" id="vnBox"><div class="vn-name title-s" id="vnName"></div><div class="vn-text" id="vnText" aria-live="polite"></div><span class="vn-next" id="vnNext" hidden>${ic('keyboard_arrow_down')}</span></div>`;
  document.body.appendChild(el); document.body.classList.add('in-vn');
  const first=lines.find(l=>l.type==='cmd'&&l.cmd==='배경'||l.type==='place'); setBg(first?(first.arg||first.text):'');
  el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ e.stopPropagation(); vnButton(b); return; } if($('#vnLog')){ $('#vnLog').remove(); return; } vnStep(); });
  document.addEventListener('keydown',vnKey);
  vnStep();
}
function vnKey(e){ if(!V) return; if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!V.choice) vnStep(); } else if(e.key==='Escape'){ if($('#vnLog')) $('#vnLog').remove(); } else if(V.choice&&/^[1-9]$/.test(e.key)){ const b=$(`#vnCh button[data-n="${e.key}"]`); if(b) vnButton(b); } }
function vnButton(b){
  if(b.id==='vnAuto'){ V.auto=!V.auto; b.classList.toggle('on',V.auto); b.innerHTML=ic(V.auto?'pause':'play_arrow'); if(V.auto&&!V.typing&&!V.choice) vnStep(); return; }
  if(b.id==='vnLogB'){ showLog(); return; }
  if(b.id==='vnSkip'){ vnSkip(); return; }
  if(b.id==='vnQuit'){ if(V.opt.replay){ vnClose(false); return; } ask('장면에서 나갈까요?','이 장면의 선택과 단서는 저장되지 않아요. 다음에 처음부터 다시 봐요.',{ok:'나가기',cancel:'계속 보기'}).then(y=>{ if(y) vnClose(false); }); return; }
  if(b.dataset.n){ const n=+b.dataset.n, o=V.choice.opts[n-1]; V.choice=null; $('#vnCh').innerHTML=''; V.pick=n;
    const found=[]; o.fx.forEach(f=>{ const r=applyEffect(f); if(r) found.push(r); }); found.forEach(clueToast); unlockCheck();
    G.state.picks.push({where:V.title,text:o.text}); V.seen.push(`(${G.meta.call}의 선택: ${o.text})`);
    showSay(G.meta.call,o.text); }
}
function clueToast(f){ toast(`단서를 찾았어요 · ${f.title}`,'gold'); }
function setBg(name){ const b=$('#vnBg'); if(b) b.setAttribute('style',bgCSS(name)); }
function vnVisible(L){ if(L.pick&&L.pick!==V.pick) return false; if(L.cond&&!condOk(L.cond)) return false; return true; }
function vnStep(){
  if(!V) return; if(V.typing){ finishType(); return; } if(V.choice) return; clearTimeout(V.autoT);
  while(V.i<V.lines.length){
    const L=V.lines[V.i++]; if(!vnVisible(L)) continue;
    if(L.type==='cmd'){ runCmd(L); continue; }
    if(L.type==='place'){ setBg(L.text); const p=$('#vnPlace'); p.textContent=L.text; p.classList.add('on'); clearTimeout(V.placeT); V.placeT=setTimeout(()=>p.classList.remove('on'),2600); V.seen.push(`[${L.text}]`); continue; }
    if(L.type==='choice'){ if(!L.opts.length) continue; V.pick=0; V.choice=L; $('#vnCh').innerHTML=L.opts.map((o,k)=>`<button class="sl" data-n="${k+1}"><span class="n">${k+1}</span><span>${esc(subName(o.text))}</span></button>`).join(''); $('#vnNext').hidden=true; return; }
    if(L.type==='say'){ if(isMe(L.who)&&V.lastPickText&&L.text===V.lastPickText) continue; showSay(L.who,L.text,L.face); return; }
    if(L.type==='nar'){ showNar(L.text); return; }
  }
  vnClose(true);
}
function runCmd(L){ const a=L.arg||'';
  if(L.cmd==='배경') setBg(a);
  else if(L.cmd==='CG'){ const it=G.lib.cg[a]; const cg=$('#vnCG'); const s=it&&imgSrc(it.img); cg.hidden=false; cg.style.backgroundImage=s?`url('${s}')`:''; cg.innerHTML=s?'':`<div class="cgph">${esc(a)}</div>`; cg.style.background=s?`#000 url('${s}') center/contain no-repeat`:'radial-gradient(circle at 50% 40%,#34362d,#0d0f08)'; V.cg=a; }
  else if(L.cmd==='CG끝'){ const cg=$('#vnCG'); cg.hidden=true; V.cg=null; }
  else if(L.cmd==='효과'){ if(/흔들/.test(a)){ const v=$('#vn'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); } else if(/플래시|섬광/.test(a)){ const f=$('#vnFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); } else if(/암전\s*끝|밝아/.test(a)) $('#vnBlack').classList.remove('on'); else if(/암전/.test(a)) $('#vnBlack').classList.add('on'); }
  else if(L.cmd==='설정'){ a.split(/[,，]/).forEach(x=>applyEffect(x)); unlockCheck(); }
  else if(L.cmd==='단서'){ a.split(/[,，\s]+/).filter(Boolean).forEach(id=>{ const f=unlockClue(id.replace(/^clue:/,'')); if(f){ clueToast(f); V.seen.push(`(단서 획득: ${f.title} — ${f.text})`); } }); unlockCheck(); }
}
function showSay(who,text,face){
  text=subName(text); const me=isMe(who), c=me?null:charByName(who);
  $('#vnName').textContent=me?(G.meta.player||G.meta.call):who; $('#vnName').style.color=me?'var(--md-tertiary)':'var(--md-primary)';
  const ch=$('#vnChar');
  const src=c&&standingSrc(c,face);
  if(c&&src&&!V.cg){ if(ch.dataset.src!==src){ ch.innerHTML=`<img alt="" src="${src}">`; ch.dataset.src=src; } ch.classList.remove('dim'); }
  else if(!me) ch.classList.add('dim');
  V.seen.push(`${me?G.meta.call:who}: ${text}`); V.log.push({who:$('#vnName').textContent,text});
  if(me) V.lastPickText=text; else V.lastPickText=null;
  typeOut(text,false);
}
function showNar(text){ text=subName(text); $('#vnName').textContent=''; V.seen.push(text); V.log.push({who:'',text}); typeOut(text,true); }
function typeOut(text,nar){ const t=$('#vnText'); t.className='vn-text'+(nar?' nar':''); t.textContent=''; V.full=text; V.typing=true; $('#vnNext').hidden=true; let k=0; clearInterval(V.timer);
  const sp=clamp(+SET.ui.speed||26,5,80); V.timer=setInterval(()=>{ k+=1; t.textContent=text.slice(0,k); if(k>=text.length) finishType(); },sp); }
function finishType(){ clearInterval(V.timer); V.typing=false; $('#vnText').textContent=V.full; $('#vnNext').hidden=false; if(V.auto) V.autoT=setTimeout(vnStep,900+V.full.length*35); }
function vnSkip(){ if(V.choice) return; let guard=0; while(V&&!V.choice&&guard++<2000){ if(V.typing) finishType(); clearTimeout(V.autoT); const before=V.i; vnStep(); if(!V||V.choice||V.i>=V.lines.length&&before===V.i) break; if(V&&V.typing) finishType(); } }
function showLog(){ const d=document.createElement('div'); d.className='vn-log'; d.id='vnLog'; d.innerHTML=`<div class="in">${V.log.map(l=>`<p>${l.who?`<b>${esc(l.who)}</b>`:''}${esc(l.text)}</p>`).join('')||'<p class="var">아직 기록이 없어요</p>'}</div>`; $('#vn').appendChild(d); d.scrollTop=d.scrollHeight; }
function vnClose(done){ if(!V) return; clearInterval(V.timer); clearTimeout(V.autoT); document.removeEventListener('keydown',vnKey); document.body.classList.remove('in-vn'); const v=V; V=null; $('#vn')&&$('#vn').remove(); v.onEnd&&v.onEnd(done?v.seen:null); }

function tf(id,label,value='',{type='text',ph='',support='',area=false,rows=3,mono=false,list='',auto='off'}={}){
  const f=area?`<textarea id="${id}" rows="${rows}" ${mono?'class="mono"':''} placeholder="${esc(ph)}" spellcheck="false">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" autocomplete="${auto}" ${list?`list="${list}"`:''}>`;

const seg=(id,label,opts,v)=>`<span class="field-lab label-l">${esc(label)}</span><div class="seg" role="radiogroup" aria-label="${esc(label)}" data-seg="${id}">${opts.map(([k,l])=>`<button type="button" role="radio" aria-checked="${String(k)===String(v)}" data-v="${k}" class="sl ${String(k)===String(v)?'on':''}">${ic('check')}${esc(l)}</button>`).join('')}</div>`;
const li=({id='',attrs='',lead='',hl='',sup='',trail='',cls='',tag='button',full=false})=>`<${tag} class="li sl ${cls}" ${id?`id="${id}"`:''} ${attrs}>${lead}<span class="txt"><span class="hl">${hl}</span>${sup?`<span class="sup ${full?'full':''}">${sup}</span>`:''}</span>${trail?`<span class="trail">${trail}</span>`:''}</${tag}>`;

/* 진행 중 다이얼로그 */
let BUSY=null;
function busy(text){ closeBusy(); const d=document.createElement('div'); d.className='scrim';
  d.innerHTML=`<div class="dialog busy" role="status" aria-live="polite"><svg class="spinner" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="20"/></svg><div class="title-m" id="busyStep">${esc(text)}</div><p class="body-s var" style="margin-top:8px">몇 분 걸릴 수 있어요. 이 화면을 닫지 마세요.</p></div>`;
  document.body.appendChild(d); BUSY=d; return m=>{ const s=$('#busyStep'); if(s) s.textContent=m; }; }
function closeBusy(){ if(BUSY){ BUSY.remove(); BUSY=null; } }
async function run(label,fn){ const step=busy(label); try{ return await fn(step); }catch(e){ console.error(e); toast(e.message||String(e),'err'); return null; }finally{ closeBusy(); } }

  const done=v=>{ const vals={}; $$('input,textarea,select',d).forEach(x=>vals[x.id]=x.type==='checkbox'?x.checked:x.value); d.remove(); res(v?vals:null); };
  d.addEventListener('click',e=>{ if(e.target===d) done(false); }); document.body.appendChild(d); $('#dlgOk',d).onclick=()=>done(true); $('#dlgNo',d).onclick=()=>done(false); const f=$('textarea,input',d); (f||$('#dlgOk',d)).focus(); }); }

const TABS=[['story','이야기','auto_stories'],['people','인물','group'],['clues','단서','search'],['talk','톡','chat_bubble'],['more','더보기','more_horiz']];
SCREENS.game=()=>{
  if(!G) return go('home');
  const S=G.state, dots={people:Object.values(S.secrets).some(t=>t>(S.seenSecrets||0)),clues:Object.values(S.clues).some(t=>t>(S.seenClues||0))};
  const tabName=TABS.find(t=>t[0]===VIEW.tab)?.[1]||'';
  app().innerHTML=`<div class="page">${appbar(VIEW.tab==='story'?'':esc(tabName),{backId:'home'})}<main id="tabBody"></main></div>
  <nav class="navbar" aria-label="게임 메뉴"><div class="in">${TABS.map(([k,l,icn])=>`<button class="nav-it" data-tab="${k}" ${VIEW.tab===k?'aria-current="page"':''}><span class="ind">${ic(icn)}${dots[k]?'<span class="badge"></span>':''}</span>${l}</button>`).join('').replace(/class="nav-it" data-tab="(\w+)" aria-current/g,'class="nav-it on" data-tab="$1" aria-current')}</div></nav>`;
  $('#home').onclick=()=>go('home');
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ VIEW.tab=b.dataset.tab; refresh(); window.scrollTo(0,0); });
  ({story:tabStory,people:tabPeople,clues:tabClues,talk:tabTalk,more:tabMore}[VIEW.tab]||tabStory)($('#tabBody'));
};
function chapterDone(ch){ return ch&&ch.stages.every(s=>G.state.done[s.id]); }
function tabStory(el){
  const S=G.state, n=G.meta.chapters, F=G.truth.facts||[], got=F.filter(f=>S.clues[f.id]).length;
  let html=`<div class="large-title" style="padding-top:0"><h2 class="headline-m g-title" style="margin:0">${esc(G.meta.title)}</h2>${G.meta.sub?`<p class="body-m var">${esc(G.meta.sub)}</p>`:''}<p class="logline">${esc(G.meta.logline)}</p>
  <div class="meta-row"><span class="chip">${ic('category')}${esc(G.meta.genre||'자유')}</span><span class="chip">${ic('group')}${G.chars.length}명</span><span class="chip">${ic('search')}단서 ${got} / ${F.length}</span></div></div>`;
  for(let i=0;i<n;i++){ const ch=G.chapters[i], prevDone=i===0||chapterDone(G.chapters[i-1]);
    if(!ch){ if(prevDone&&!S.ended) html+=`<section class="chapter cur"><div class="ch-h"><span class="label-l ch-n">${i+1}장</span><span class="ch-t">아직 쓰이지 않았어요</span></div><p class="body-m var" style="padding:0 16px">지금까지의 선택과 찾은 단서를 반영해서 써요.</p><div class="acts"><button class="btn filled sl" data-write="${i}">${ic('edit')}${i+1}장 쓰기</button></div></section>`;
      else html+=`<section class="chapter locked"><div class="ch-h"><span class="label-l ch-n">${i+1}장</span><span class="ch-t">${ic('lock','')}</span></div></section>`; continue; }
    const done=chapterDone(ch);
    html+=`<section class="chapter ${done?'done':'cur'}"><div class="ch-h"><span class="label-l ch-n">${i+1}장</span><span class="ch-t">${esc(ch.title)}</span></div>
    <div>${ch.stages.map((s,k)=>{ const ok=S.done[s.id], open=k===0||S.done[ch.stages[k-1].id];
      return li({cls:'stage'+(ok?' done':''),attrs:`data-play="${i}:${k}" ${open?'':'disabled'}`,lead:leadIc(ok?'check':open?'play_arrow':'lock',open&&!ok?'':ok?'':'dim'),hl:esc(s.title),trail:ok?'다시 보기':open?'보기':'잠김'}); }).join('')}</div>
    ${done&&ch.summary?`<p class="summary body-m">${esc(ch.summary)}</p>`:''}</section>`; }
  const lastDone=G.chapters.length===n&&chapterDone(G.chapters[n-1])&&G.chapters[n-1].summary;
  if(lastDone) html+= S.ended?`<section class="chapter done"><div class="ch-h"><span class="label-l ch-n">엔딩</span><span class="ch-t">${esc(S.endingTitle)}</span></div>${li({id:'replayEnd',cls:'stage done',lead:leadIc('star'),hl:'엔딩 다시 보기',trail:'보기'})}<div class="acts"><button class="btn tonal sl" id="truthB">${ic('visibility')}진실 확인하기</button></div></section>`
    :`<section class="chapter cur"><div class="ch-h"><span class="label-l ch-n">엔딩</span><span class="ch-t">결말</span></div><p class="body-m var" style="padding:0 16px">지금까지의 선택과 찾은 단서로 결말이 정해져요.</p><div class="acts"><button class="btn filled sl" id="endB">결말 보기</button></div></section>`;
  el.innerHTML=html;
  $$('[data-write]',el).forEach(b=>b.onclick=()=>writeChapter(+b.dataset.write));
  $$('[data-play]',el).forEach(b=>b.onclick=()=>{ const [i,k]=b.dataset.play.split(':').map(Number); playStage(i,k); });
  const eb=$('#endB',el); if(eb) eb.onclick=startEnding;
  const rb=$('#replayEnd',el); if(rb) rb.onclick=()=>{ const snap=JSON.stringify(G.state); playScript('엔딩 · '+S.endingTitle,S.endingScript,()=>{ G.state=JSON.parse(snap); },{replay:true}); };
  const tb=$('#truthB',el); if(tb) tb.onclick=()=>{ VIEW.tab='more'; G.author=true; saveG(); refresh(); };
}
async function writeChapter(i){ if(i>0&&!G.chapters[i-1].summary){ const ok=await run('앞 장을 정리하는 중',()=>genSummary(G.chapters[i-1])); if(ok==null) return; }
  const r=await run(`${i+1}장을 쓰는 중`,step=>genChapter(i,step)); if(r){ toast(`${i+1}장이 준비됐어요`); refresh(); } }
function playStage(i,k){ const ch=G.chapters[i], s=ch.stages[k], snap=JSON.stringify(G.state), replay=!!G.state.done[s.id];
  if(replay){ playScript(`${i+1}장 · ${s.title}`,s.script,()=>{ G.state=JSON.parse(snap); refresh(); },{replay:true}); return; } // 다시 보기는 상태를 바꾸지 않아요
  playScript(`${i+1}장 · ${s.title}`,s.script,async seen=>{
    if(!seen){ G.state=JSON.parse(snap); refresh(); return; }
    G.state.done[s.id]=Date.now(); G.state.seen[s.id]=seen; unlockCheck(); await saveG();
    if(k===ch.stages.length-1){ // 장이 끝나면 요약하고 다음 장을 미리 써 둬요
      await run(`${i+1}장을 정리하는 중`,()=>genSummary(ch));
      if(i+1<G.meta.chapters){ const r=await run(`${i+2}장을 쓰는 중`,step=>genChapter(i+1,step)); if(r) toast(`${i+2}장이 준비됐어요`); }
      else toast('마지막 장을 마쳤어요. 결말을 볼 수 있어요','gold'); }
    refresh(); });
}

async function exportGame(){
  const v=await askForm('친구에게 보내기',`<p class="body-m var" style="margin-bottom:8px">게임 파일을 만들어요. 친구는 홈의 가져오기로 열면 돼요. 키는 들어가지 않아요.</p>
    ${sw('xImg','그림 포함','파일이 커지지만 친구도 같은 그림을 봐요',true)}${sw('xProg','내 진행 포함','끄면 친구가 진실을 모른 채 1장부터 해요',false)}`,{ok:'내보내기'});
  if(!v) return;
  const g=JSON.parse(JSON.stringify(G));
  if(!v.xProg){ g.state=freshState(g); g.chats={}; g.chapters=[]; Object.keys(g.lib.cg).forEach(k=>{ if(!g.lib.cg[k].img) delete g.lib.cg[k]; }); }
  g.author=false; const imgs={};
  if(v.xImg) for(const id of allImgIds(g)){ const b=await DB.get('imgs',id); if(b) imgs[id]=await blobToDataURL(b); } else { g.chars.forEach(c=>{ c.img=null; (c.faces||[]).forEach(f=>f.img=null); }); ['bg','cg'].forEach(k=>Object.values(g.lib[k]).forEach(x=>x.img=null)); }
  const bytes=new TextEncoder().encode(JSON.stringify({format:'story-lens',v:1,game:g,imgs})); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['STORYLENS1:'+btoa(bin)],{type:'text/plain'})); a.download=`${G.meta.title.replace(/[\\/:*?"<>|]/g,'')||'story'}.storylens`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('게임 파일을 저장했어요');
}
async function importGame(){
  const i=document.createElement('input'); i.type='file'; i.accept='.storylens,.txt,.json';
  i.onchange=async()=>{ const f=i.files&&i.files[0]; if(!f) return;
    try{ let t=(await f.text()).trim(); if(t.startsWith('STORYLENS1:')){ const bin=atob(t.slice(11)); const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k); t=new TextDecoder().decode(u); }
      const o=JSON.parse(t); if(o.format!=='story-lens'||!o.game) throw new Error('이야기 렌즈 게임 파일이 아니에요.');
      const g=o.game, map={};
      for(const [id,du] of Object.entries(o.imgs||{})) map[id]=await imgPut(await dataURLToBlob(du));
      const fix=x=>{ if(x&&x.img) x.img=map[x.img]||null; }; g.chars.forEach(c=>{ fix(c); (c.faces||[]).forEach(fix); }); ['bg','cg'].forEach(k=>Object.values(g.lib[k]||{}).forEach(fix));
      g.id='g'+uid(); g.updated=Date.now(); await DB.put('games',g.id,g); toast(`「${g.meta.title}」을 가져왔어요`); await openGame(g.id); }
    catch(e){ toast('가져오지 못했어요. '+e.message,'err'); } };
  i.click();
}
